<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>검열실 상황판 · 교사용 관제판</title>
<style>
/* TV에서 학생 시를 손글씨(그리운 묘은흘림체)로 보여 줌. 글꼴 파일은 학생 게임 폴더의 것을 같이 씀 */
@font-face{font-family:"GriunMyoeun";src:url(../game/fonts/Griun_MyoeunHeullim-Rg.woff2) format("woff2");font-display:swap}
:root{--bg:#101218;--card:#1a1d26;--line:#2d313d;--tx:#f1efe8;--mute:#8d93a3;--amber:#e0a93f;--ok:#6bb585;--bad:#e5484d}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--tx);font-family:"Pretendard","Noto Sans KR","Malgun Gothic",system-ui,sans-serif}
body{display:flex;flex-direction:column;padding:2vh 2vw;gap:1.8vh;overflow:hidden}
header{display:flex;align-items:center;gap:2vw}
header h1{margin:0;font-size:3.6vh;letter-spacing:.02em}
header .sp{flex:1}
.code{display:flex;align-items:center;gap:1.4vw;background:var(--card);border:2px solid var(--line);padding:1vh 1.4vw}
.code b{font-size:5vh;letter-spacing:.18em;color:var(--amber)}
.code small{color:var(--mute);font-size:1.7vh;display:block}
#qr{background:#fff;padding:6px;line-height:0}
.dot{width:1.4vh;height:1.4vh;border-radius:50%;background:var(--bad);display:inline-block;margin-right:.6vw}
.dot.on{background:var(--ok)}
button{font:inherit;color:var(--tx);background:#262a36;border:2px solid var(--line);padding:.8vh 1vw;cursor:pointer;font-size:1.8vh}
button:hover{border-color:var(--amber)}
.grid{flex:1;display:grid;grid-template-columns:repeat(4,1fr);grid-template-rows:repeat(2,1fr);gap:1.4vw;min-height:0}
.g{background:var(--card);border:3px solid var(--line);padding:1.4vh 1.2vw;display:flex;flex-direction:column;gap:.9vh;position:relative;overflow:hidden;min-height:0}
.g .top{display:flex;justify-content:space-between;align-items:baseline}
.g .no{font-size:4vh;font-weight:800}
.g .tm{font-size:3.4vh;font-weight:800;font-variant-numeric:tabular-nums}
.g .tm.low{color:var(--bad)}
.g .st{font-size:2.2vh;color:var(--tx);min-height:2.8vh}
.g.empty{opacity:.35}
.g.empty .st{color:var(--mute)}
.trk{display:flex;gap:.4vw}
.trk i{flex:1;height:1.3vh;background:#2b2f3b}
.trk i.f{background:var(--amber)}
.trk i.c{background:var(--amber);animation:bl 1s infinite}
@keyframes bl{50%{opacity:.35}}
.sus{display:flex;align-items:center;gap:.6vw;font-size:1.8vh;color:var(--mute)}
.sus .bar{flex:1;height:1.5vh;background:#2b2f3b;border:2px solid #0a0b0e}
.sus .bar i{display:block;height:100%;background:var(--ok);width:0;transition:width .5s}
.g.warn{border-color:var(--bad);animation:pl 1.2s infinite}
@keyframes pl{50%{box-shadow:0 0 0 .6vh rgba(229,72,77,.35)}}
.g.done{border-color:var(--ok);background:#16241c}
.g.caught{border-color:var(--bad);background:#2a1416}
.g.caught .st{color:#ff9a8c;font-weight:800}
.g .ctl{display:flex;gap:.5vw;margin-top:auto}
.g .ctl button{flex:1;font-size:1.7vh;padding:.6vh .4vw}
.g .ctl button.on{background:var(--amber);color:#101218;border-color:var(--amber);font-weight:800}
.g.empty .ctl{display:none}
.lim{display:flex;align-items:center;gap:.6vw;background:var(--card);border:2px solid var(--line);padding:1vh 1vw}
.lim small{color:var(--mute);font-size:1.7vh;display:block}
.lim b{font-size:4.4vh;color:var(--tx);min-width:3.2ch;text-align:center;font-variant-numeric:tabular-nums}
.lim button{font-size:3vh;font-weight:800;width:5.5vh;height:5.5vh;padding:0}
.g .piece{display:none;position:absolute;inset:0;background:#10281c;flex-direction:column;align-items:center;justify-content:center;gap:.6vh}
.g.done .piece{display:flex}
.piece .ch{font-size:15vh;line-height:1;font-weight:800;color:#fff;text-shadow:0 .5vh 0 #0a0b0e}
.piece .lb{font-size:2.4vh;color:var(--ok)}
.piece .tt{font-size:1.9vh;color:var(--mute)}
.sum{display:flex;align-items:center;gap:2vw;background:var(--card);border:2px solid var(--line);padding:1.2vh 1.6vw}
.sum .lt{font-size:2.2vh;color:var(--mute)}
.slots{display:flex;gap:1vw}
.slot{width:9vh;height:9vh;border:3px dashed #3a3f4d;display:flex;align-items:center;justify-content:center;font-size:6vh;font-weight:800;color:transparent;position:relative}
.slot.on{border:3px solid var(--amber);color:var(--amber);background:#241f10}
.slot small{position:absolute;bottom:-2.6vh;left:0;right:0;text-align:center;font-size:1.5vh;color:var(--mute);font-weight:400}
.sum .fill{flex:1}
#done{position:fixed;inset:0;background:rgba(10,11,14,.92);display:none;flex-direction:column;align-items:center;justify-content:center;gap:3vh;z-index:9}
#done.show{display:flex}
#done .w{font-size:16vh;font-weight:800;color:var(--amber);letter-spacing:.2em}
#done .s{font-size:3vh;color:var(--tx)}
.conf{position:fixed;top:-5vh;width:1.2vh;height:2.2vh;animation:fall linear forwards;z-index:10}
@keyframes fall{to{transform:translateY(112vh) rotate(720deg)}}
 /* 위장 시 검토 */
.g .rv{display:none;font-size:2vh;font-weight:800;color:#101218;background:var(--amber);padding:.5vh .8vw;text-align:center;animation:bl 1.2s infinite}
.g.ask{border-color:var(--amber);cursor:pointer}
.g.ask .rv{display:block}
.g.haspoem{cursor:pointer}
#rq{display:none;background:var(--amber);color:#101218;border-color:var(--amber);font-weight:800;font-size:2.2vh}
#rq.on{display:block;animation:bl 1.2s infinite}
#rv{position:fixed;inset:0;background:rgba(10,11,14,.88);display:none;align-items:center;justify-content:center;z-index:15;padding:4vh 4vw}
#rv.show{display:flex}
#rv .box{background:var(--card);border:3px solid var(--amber);width:min(100%,120vh);max-height:100%;display:flex;flex-direction:column;gap:2.4vh;padding:3.5vh 3vw;overflow:auto}
#rv .hd{display:flex;align-items:baseline;gap:1.4vw;font-size:2.4vh;color:var(--mute)}
#rv .hd b{font-size:4.4vh;color:var(--tx)}
#rv .hd .sp{flex:1}
#rv pre{margin:0;font:inherit;font-family:"GriunMyoeun","Noto Sans KR","Malgun Gothic",sans-serif;font-size:5.2vh;line-height:1.55;white-space:pre-wrap;word-break:keep-all;background:#f1ead8;color:#2a241a;padding:3vh 3vw;border:2px solid #0a0b0e}
#rv details{font-size:2.4vh;color:var(--mute)}
#rv summary{cursor:pointer}
#rv details p{color:var(--tx);font-size:3vh;margin:1.2vh 0 0;white-space:pre-wrap}
#rv .act{display:flex;gap:1.4vw}
#rv .act button{font-size:3.2vh;padding:1.6vh 3vw;font-weight:800}
#rv .act .ok{background:#1f4a30;border-color:var(--ok)}
#rv .act .no{background:#4a1f22;border-color:var(--bad)}
#rv .act .vg{background:#3d3420;border-color:var(--amber)}
#rv .act .sp{flex:1}
#rv .st{font-size:2.6vh;font-weight:800}
#setup{position:fixed;inset:0;background:var(--bg);display:none;flex-direction:column;align-items:center;justify-content:center;gap:2vh;z-index:20}
#setup.show{display:flex}
#setup input{font:inherit;font-size:5vh;text-align:center;width:20ch;background:var(--card);color:var(--tx);border:3px solid var(--line);padding:1vh}
</style>
<link rel="stylesheet" href="teacher-vintage.css">
</head>
<body>
<div class="room-props" aria-hidden="true"><img class="prop-lamp" src="vintage-assets/censor-room/lamp.webp" alt=""><img class="prop-books" src="vintage-assets/censor-room/books.webp" alt=""><img class="prop-ink" src="vintage-assets/censor-room/ink_documents.webp" alt=""><img class="prop-typewriter" src="vintage-assets/censor-room/typewriter.webp" alt=""></div>
<header>
  <h1>검열실 상황판</h1>
  <span class="sp"></span>
  <div class="code"><div class="entry-paper"><div id="qr"></div></div><div class="room-info"><small>학생 입장 방 번호</small><div class="room-number"><b id="rc">----</b></div><small id="lk"></small><span id="conn"><i class="dot" id="cd"></i><span id="ct">연결 중…</span></span></div></div>
  <div class="lim"><div><small>제한 시간</small><span id="lm" style="font-size:1.5vh;color:var(--mute)"></span></div><button id="mdn" type="button" aria-label="1분 줄이기">−</button><b id="mv">20</b><span style="font-size:2.4vh">분</span><button id="mup" type="button" aria-label="1분 늘리기">+</button></div>
  <button id="rq" type="button"></button>
  <div style="display:flex;flex-direction:column;gap:.8vh"><button id="newroom" type="button">＋ 새 검열실 개설</button><button id="clear" type="button">기록 초기화</button></div>
</header>
<section class="grid" id="grid"></section>
<section class="sum"><span class="lt">모은 글자</span><div class="slots" id="slots"></div><span class="fill"></span><span class="lt" id="cnt"></span></section>
<div id="done"><div class="w" id="dw"></div><div class="s">모든 조각이 모였습니다!</div><button id="dx" type="button">닫기</button></div>
<div id="rv" role="dialog" aria-modal="true"><div class="box">
  <div class="hd"><b id="rvg"></b><span>위장한 시</span><span class="sp"></span><span id="rvw"></span></div>
  <pre id="rvp"></pre>
  <details id="rvd"><summary>동지만 아는 뜻 보기</summary><p id="rvm"></p></details>
  <div class="act"><button class="ok" id="rvok" type="button">통과</button><button class="no" id="rvcz" type="button">검열</button><button class="vg" id="rvvg" type="button">의미 모호</button><span class="st" id="rvs"></span><span class="sp"></span><button id="rvx" type="button">닫기</button></div>
</div></div>
<div id="setup"><h2>방 번호를 정하세요</h2><input id="si" maxlength="12" placeholder="예: 3반 또는 1234"><button id="sg" type="button">시작</button><button id="sr" type="button">랜덤 4자리로 시작</button></div>
<dialog id="action-confirm" aria-labelledby="confirm-title" aria-describedby="confirm-message">
  <form method="dialog">
    <h2 id="confirm-title">작업 확인</h2>
    <p id="confirm-message"></p>
    <div class="confirm-actions"><button value="cancel" autofocus>취소</button><button value="accept" id="confirm-accept">확인</button></div>
  </form>
</dialog>
<script>
/* ===== 대사·설정 파일 =====
   이 파일만 고치면 대사와 설정이 바뀝니다. 고친 뒤 game.html을 브라우저에서 새로고침하세요.
   1) CONFIG  : 제한 시간, 비밀번호, 모둠 수, 시구 카드, 압수 문서
   2) PRO     : 프롤로그(정문 경비원 장면) 대사
   3) EPI     : 에필로그(접선책, 미나미 다로의 뜻) 대사
   3-1) BADEND: 제한 시간이 끝났을 때 나오는 배드엔딩 대사
   4) FLAVOR  : 검열실 물건을 눌렀을 때 나오는 한 줄
   5) TEXT    : 대사가 아닌 화면 글 전부 (첫 화면, 임무 안내, 단계 설명, 힌트, 정답·오답 메시지, 결과 화면)
   ※ caption: 사람 없이 화면 가운데 글만 잠깐 떴다가 넘어가는 장면 자막  예) {bg:"street",caption:"1940년대 초, 경성, 어느 날 새벽"}
   ※ mood는 표정입니다. guard: 생략(화남)/calm/sus, boss: 생략(보통)/sus, contact: 생략(보통)/side/happy
*/
/* ===== 선생님이 고칠 수 있는 설정 =====
   - cards: 1단계 시구 카드(실제 시 발췌). text(줄 배열), clues(근거 낱말: 발췌문에 실제로 있는 말), answer(시기, periods 중 하나), why(설명).
     title은 교사용 메모로 화면에는 나오지 않습니다(학생이 시인 이름으로 시기를 맞히지 않도록).
   - docs: 2단계 압수 문서. type은 '직접' '돌려' '안으로' 중 하나. '직접'에만 삭제 도장이 찍힙니다.
   - teacherPin: TV 연결이 안 될 때 문 앞에서 쓰는 비밀번호. 이 파일을 보는 사람은 누구나 알 수 있습니다.
     (관리 모드와 +5분은 교실 TV에서 조마다 켭니다.) */
const CONFIG={
  minutes:20, hintPenaltySec:30, teacherPin:"1919", requireTeacher:true,
  finalWord:"그날이오면", groups:8,
  periods:["1910년대","1920년대","1930년대","1930년대 말~1940년대 초"],
  cards:[
    {title:"김소월 「초혼」",
     text:["산산이 부서진 이름이여!","허공중에 헤어진 이름이여!","불러도 주인 없는 이름이여!","부르다가 내가 죽을 이름이여!"],
     clues:["이름"],answer:"1920년대",
     why:"죽은 이를 부르며 잃은 것을 애타게 찾는 모습에서 나라 잃은 상실감과 한이 드러납니다."},
    {title:"백석 「여승」 (저작권이 남은 시라 두 줄만 인용)",
     text:["평안도의 어느 산 깊은 금점판","나는 파리한 여인(女人)에게서 옥수수를 샀다"],
     clues:["금점판","파리한","옥수수"],answer:"1930년대",
     why:"가난과 유랑, 가족을 잃은 일상의 이야기입니다. 직접 말하기를 피하고 일상으로 눈을 돌렸습니다."},
    {title:"이육사 「절정」",
     text:["이러매 눈 감아 생각해 볼밖에","겨울은 강철로 된 무지갠가 보다."],
     clues:["겨울","강철"],answer:"1930년대 말~1940년대 초",
     why:"‘겨울’, ‘강철’ 같은 낱말로 견디기 어려운 한계 상황을 상징에 담아 돌려 말했습니다."},
    {title:"윤동주 「서시」",
     text:["죽는 날까지 하늘을 우러러","한 점 부끄럼이 없기를,","잎새에 이는 바람에도","나는 괴로워했다."],
     clues:["부끄럼","괴로워했다"],answer:"1930년대 말~1940년대 초",
     why:"부끄러움과 자기 성찰이 드러납니다. 말하기 어려운 시대에 시선을 안으로 향했습니다."}
  ],
  /* marks: 화면에서 눈에 띄게 표시할 낱말. why: 교사용 분류 근거(화면에는 안 나옴) */
  docs:[
    {title:"기미독립선언서 「공약 삼장」 첫째 항",type:"직접",
     text:"금일 오인의 차거는 정의, 인도, 생존, 존영을 위하는 민족적 요구이니, 오직 자유적 정신을 발휘할 것이요, 결코 배타적 감정으로 일주하지 말라.",
     why:"민족의 자유와 정당한 요구를 명시적으로 밝히고 독립운동의 방향을 선언함."},
    {title:"이상화 「빼앗긴 들에도 봄은 오는가」",type:"돌려",marks:["들","봄"],
     text:"지금은 남의 땅 ― 빼앗긴 들에도 봄은 오는가?\n나는 온몸에 햇살을 받고\n푸른 하늘 푸른 들이 맞붙은 곳으로",
     why:"빼앗긴 국토와 국권을 ‘빼앗긴 들’로, 국권 회복의 희망을 ‘봄’으로 상징함."},
    {title:"한용운 「님의 침묵」",type:"돌려",
     text:"님은 갔습니다. 아아, 사랑하는 나의 님은 갔습니다.\n푸른 산빛을 깨치고 단풍나무 숲을 향하여 난 작은 길을 걸어서, 차마 떨치고 갔습니다.\n황금의 꽃같이 굳고 빛나던 옛 맹세는 차디찬 티끌이 되어서 한숨의 미풍에 날아갔습니다.",
     why:"‘님’이라는 상징적 대상으로 상실과 이별을 표현함. 잃은 나라, 조국에 대한 그리움으로도 읽을 수 있음."},
    {title:"이육사 「청포도」",type:"돌려",
     text:"내가 바라는 손님은 고달픈 몸으로\n청포를 입고 찾아온다고 했으니",
     why:"바라는 미래를 ‘손님’이라는 상징적 대상으로 표현해 광복에 대한 염원을 간접적으로 드러냄."},
    {title:"윤동주 「자화상」",type:"안으로",
     text:"산모퉁이를 돌아 논 가 외딴 우물을 홀로 찾아가선 가만히 들여다봅니다.\n우물 속에는 달이 밝고 구름이 흐르고 하늘이 펼치고 파아란 바람이 불고 가을이 있습니다.\n그리고 한 사나이가 있습니다.",
     why:"우물에 비친 자신을 바라보며 내면을 성찰함."},
    {title:"정지용 「유리창 1」",type:"안으로",
     text:"유리에 차고 슬픈 것이 어른거린다.\n열없이 붙어 서서 입김을 흐리우니\n길들은 양 언 날개를 파닥거린다.",
     why:"상실의 슬픔을 바깥으로 외치지 않고 화자의 내면에 집중해 감각적 이미지로 절제하여 드러냄."}
  ],
  s2quiz:{q:"삭제 도장이 찍힌 글은 어떤 특징을 지니고 있는가?",
    opts:["고향과 가족을 그리워하는 내용이다","일제의 지배와 탄압을 직접 비판하고 저항을 외쳤다","자연물에 빗대어 희망을 노래했다","새로운 학문을 배우자고 권했다"],ans:1},

  m3:{wrongSus:3, snap:34},   // wrongSus: 색이 다른 곳에 걸었을 때 의심도, snap: 끝점을 인식하는 거리(클수록 쉬움)

<script>
/* 교실 TV(teacher.html)로 진행 상황을 보내는 코드. 학생 게임이 쓰고, teacher.html도 같이 씁니다.
   Firebase Realtime Database의 REST 주소만 쓰므로 별도 라이브러리는 없습니다.
   인터넷이 막히거나 방 번호가 없으면 아무 일도 하지 않고 게임은 그대로 돌아갑니다. */
const NET={
  db:"https://gugeo-c23ae-default-rtdb.asia-southeast1.firebasedatabase.app",
  root:"censor"
};
const netRoomOk=r=>/^[0-9A-Za-z가-힣-]{2,12}$/.test(r||"");
const netPiece=g=>{const w=CONFIG.finalWord;return w[(g-1)%w.length];};
const netUrl=(room,g)=>`${NET.db}/${NET.root}/${encodeURIComponent(room)}${g?"/groups/"+g:""}.json`;
let _netSig="", _netAt=0;
function netPush(force){
  if(typeof S==="undefined"||!netRoomOk(S.room)||!S.group) return;
  const d={stage:S.stage|0, where:(typeof curKey!=="undefined"&&curKey)||"", sus:Math.min(100,S.sus|0), hints:S.hints|0, grilled:S.grilled|0,
    start:S.start||0, penalty:S.penalty|0, extra:S.extra|0, min:CONFIG.minutes, done:S.done||0, caught:S.caught||0, epi:S.done&&S.epi?1:0, piece:S.done?netPiece(S.group):"", t:Date.now()};
  const sig=JSON.stringify(Object.assign({},d,{t:0})), now=Date.now();
  if(!force&&sig===_netSig&&now-_netAt<10000) return;
  _netSig=sig; _netAt=now;
  try{ fetch(netUrl(S.room,S.group),{method:"PUT",body:JSON.stringify(d),keepalive:true}).catch(()=>{}); }catch(e){}
}
function netClear(room,g){ if(!netRoomOk(room)) return Promise.resolve();
  const del=u=>{ try{ return fetch(u,{method:"DELETE"}).catch(()=>{}); }catch(e){ return Promise.resolve(); } };
  // 방 전체는 규칙상 한 번에 못 지우므로, 조마다 groups·poems·verdict 칸을 한 요청으로 비웁니다
  if(!g){ const d={}; for(let n=1;n<=Math.max(CONFIG.groups,20);n++) ["groups","poems","verdict","ctl"].forEach(k=>d[k+"/"+n]=null);
    try{ return fetch(netUrl(room),{method:"PATCH",body:JSON.stringify(d)}).catch(()=>{}); }catch(e){ return Promise.resolve(); } }
  return Promise.all([del(netUrl(room,g)),del(netKindUrl(room,"poems",g)),del(netKindUrl(room,"verdict",g)),del(netKindUrl(room,"ctl",g))]); }
// 3단계 위장 시: 학생이 censor/방/poems/조 에 올리고, TV가 censor/방/verdict/조 에 판정을 적습니다.
// kind: pass(통과) · censor(검열에 걸림: 상관 등장, 취조실) · vague(의미 모호: 접선책이 돌려보냄)
// verdict.for 에는 판정한 시의 t를 적어, 시를 고쳐 다시 내면 예전 판정은 무시됩니다.
const netKindUrl=(room,kind,g)=>`${NET.db}/${NET.root}/${encodeURIComponent(room)}/${kind}/${g}.json`;
function netPoem(){
  if(typeof S==="undefined"||!netRoomOk(S.room)||!S.group||!S.poem) return Promise.resolve(false);
  const d={poem:S.poem.slice(0,500),meaning:(S.meaning||"").slice(0,300),t:S.poemAt||Date.now()};
  try{ return fetch(netKindUrl(S.room,"poems",S.group),{method:"PUT",body:JSON.stringify(d)}).then(r=>r.ok).catch(()=>false); }catch(e){ return Promise.resolve(false); }
}
function netVerdict(room,g){
  try{ return fetch(netKindUrl(room,"verdict",g),{cache:"no-store"}).then(r=>r.ok?r.json():null).catch(()=>null); }catch(e){ return Promise.resolve(null); }
}
function netJudge(room,g,kind,forT){
  try{ return fetch(netKindUrl(room,"verdict",g),{method:"PUT",body:JSON.stringify({ok:kind==="pass",kind,for:forT,t:Date.now()})}).then(r=>r.ok).catch(()=>false); }catch(e){ return Promise.resolve(false); }
}
setInterval(()=>netPush(false),4000);
// 제한 시간: TV에서 바꾼 분(censor/방/settings/minutes)을 8초마다 받아 CONFIG.minutes에 반영
const netSetUrl=room=>`${NET.db}/${NET.root}/${encodeURIComponent(room)}/settings.json`;
function netSettings(){
  if(typeof S==="undefined"||!netRoomOk(S.room)) return;
  try{ fetch(netSetUrl(S.room),{cache:"no-store"}).then(r=>r.ok?r.json():null).then(j=>{
    const m=j&&j.minutes; if(!Number.isInteger(m)||m<1||m>120||m===CONFIG.minutes) return;
    CONFIG.minutes=m; if(typeof paintClock==="function") paintClock(); netPush(true);
  }).catch(()=>{}); }catch(e){}
}
function netSetMinutes(room,m){
  try{ return fetch(netSetUrl(room),{method:"PUT",body:JSON.stringify({minutes:m})}).then(r=>r.ok).catch(()=>false); }catch(e){ return Promise.resolve(false); }
}
setTimeout(netSettings,300); setInterval(netSettings,8000);
// 조별 관리: censor/방/ctl/조 = {sec: TV에서 준 추가 시간(초, 누적), admin: 관리 모드}. 5초마다 받아 옴
function netCtl(){
  if(typeof S==="undefined") return;
  if(!netRoomOk(S.room)||!S.group){ if(typeof teacherMode!=="undefined"&&teacherMode) setTeacherMode(false); return; }
  try{ fetch(netKindUrl(S.room,"ctl",S.group),{cache:"no-store"}).then(r=>r.ok?r.json():null).then(j=>{
    j=j||{}; if(typeof applyBonus==="function") applyBonus(Number.isInteger(j.sec)?j.sec:S.extra);
    if(typeof setTeacherMode==="function"&&!!j.admin!==teacherMode) setTeacherMode(!!j.admin);
  }).catch(()=>{}); }catch(e){}
}
function netSetCtl(room,g,patch){
  try{ return fetch(netKindUrl(room,"ctl",g),{method:"PATCH",body:JSON.stringify(patch)}).then(r=>r.ok).catch(()=>false); }catch(e){ return Promise.resolve(false); }
}
setTimeout(netCtl,500); setInterval(netCtl,5000);

</script>
<script>
const $=s=>document.querySelector(s);
function confirmAction(title,message,label="확인"){
  const dialog=$("#action-confirm");
  if(dialog.open) return Promise.resolve(false);
  $("#confirm-title").textContent=title; $("#confirm-message").textContent=message;
  $("#confirm-accept").textContent=label; dialog.returnValue="cancel";
  return new Promise(resolve=>{
    const finish=accepted=>{
      dialog.querySelector("form").onsubmit=null; dialog.oncancel=null;
      dialog.close(accepted?"accept":"cancel"); resolve(accepted);
    };
    dialog.querySelector("form").onsubmit=e=>{e.preventDefault();finish(e.submitter?.value==="accept");};
    dialog.oncancel=e=>{e.preventDefault();finish(false);};
    dialog.showModal();
  });
}
const params=new URLSearchParams(location.search);
let room=(params.get("room")||localStorage.getItem("censor-room")||"").trim();
let data={};            // {groups:{1:{...}}}
let celebrated=false;
const WHERE={s1:"1단계 · 시구 카드 분석",m1:"서랍 뒤지는 중",s2:"2단계 · 압수 문서 분류",m2:"서류함 · 리본 꺼내는 중",boss:"상관이 자리를 비움",m3:"타자기에 리본 거는 중",s3:"3단계 · 위장 시 쓰기",door:"문 앞 · 접선 중"};
const STAGE={0:"작전 준비 중",1:"검열실 수색 중",2:"서류함 앞",3:"타자기 앞",4:"접선 지점으로 이동"};
const STEPS=7;
function stepIdx(g){ if(g.done) return STEPS;
  const w=g.where, st=g.stage|0;
  if(st<=0) return 0;
  if(st===1) return w==="m1"?1:0;
  if(st===2) return w==="m2"?3:2;
  if(st===3) return w==="s3"?5:(w==="m3"?4:4);
  return 6; }
const remain=g=>{ if(!g.start) return (g.min||CONFIG.minutes)*60;
  const end=g.done||g.caught||Date.now(); return Math.round((g.min||CONFIG.minutes)*60+(g.extra||0)-(end-g.start)/1000-(g.penalty||0)); };
const fmt=t=>{const a=Math.abs(t);return (t<0?"+":"")+String(Math.floor(a/60)).padStart(2,"0")+":"+String(a%60).padStart(2,"0");};
function build(){
  const N=CONFIG.groups; $("#grid").innerHTML=Array.from({length:N},(_,i)=>`<div class="g empty" id="g${i+1}">
    <div class="top"><span class="no">${i+1}조</span><span class="tm" id="tm${i+1}">--:--</span></div>
    <div class="st" id="st${i+1}">아직 입장 전</div>
    <div class="trk" id="tk${i+1}">${"<i></i>".repeat(STEPS)}</div>
    <div class="sus"><span>의심 정도</span><div class="bar"><i id="sb${i+1}"></i></div><b id="sn${i+1}">0</b></div>
    <div class="rv">시 확인 요청 · 눌러서 보기</div>
    <div class="ctl"><button type="button" id="p5${i+1}" title="이 조에 5분 더 주기 (붙잡힌 조는 다시 이어서 함)">+5분</button><button type="button" id="mode${i+1}" title="이 조 기기에 관리 모드(바로 가기·넘기기)를 켜고 끕니다">관리 모드</button></div>
    <div class="piece"><div class="lb">${i+1}조 탈출 성공!</div><div class="ch" id="pc${i+1}"></div><div class="tt" id="pt${i+1}"></div></div></div>`).join("");
  for(let i=1;i<=N;i++){ $("#g"+i).onclick=()=>{ if((data.poems||{})[i]) openReview(i); };
    $("#p5"+i).onclick=e=>{ e.stopPropagation(); giveTime(i); };
    $("#mode"+i).onclick=e=>{ e.stopPropagation(); toggleAdmin(i); }; }
  const w=CONFIG.finalWord; $("#slots").innerHTML=[...w].map((c,i)=>`<div class="slot" id="sl${i}">${c}<small id="sg${i}"></small></div>`).join("");
}
function paint(){
  const G=data.groups||{}, now=Date.now(); const got={}; 
  for(let n=1;n<=CONFIG.groups;n++){
    const g=G[n], el=$("#g"+n); if(!el) continue;
    const ask=pending(n), hp=!!(data.poems||{})[n];
    if(!g){ el.className="g empty"+(ask?" ask":hp?" haspoem":""); $("#st"+n).textContent="아직 입장 전"; $("#tm"+n).textContent="--:--"; $("#sb"+n).style.width="0"; $("#sn"+n).textContent="0";
      [...$("#tk"+n).children].forEach(i=>i.className=""); paintCtl(n); continue; }
    const idx=stepIdx(g), r=remain(g), sus=Math.min(100,g.sus||0), stale=!g.done&&now-(g.t||0)>40000;
    const fin=!!(g.done&&g.epi);   // 에필로그까지 다 본 뒤에 글자 조각을 보여 줌
    const cau=!g.done&&!!g.caught;  // 시간 초과로 붙잡힘(배드엔딩)
    const poem=(data.poems||{})[n], verdict=(data.verdict||{})[n];
    const censored=!g.done&&!cau&&!!poem&&!!verdict&&verdict.for===poem.t&&verdict.kind==="censor";
    el.className="g"+(fin?" done":"")+(cau?" caught":"")+(censored?" censored":"")+(ask?" ask":(!g.done&&sus>=70?" warn":""))+(hp?" haspoem":"");
    $("#st"+n).textContent=cau?"시간 초과 · 붙잡힘":fin?"탈출 성공":g.done?"탈출 · 에필로그 보는 중":(stale?"신호 끊김 · ":"")+(WHERE[g.where]||STAGE[g.stage|0]||"");
    const tm=$("#tm"+n); tm.textContent=g.done?fmt(Math.max(0,Math.round((g.done-g.start)/1000)+(g.penalty||0)-(g.extra||0))):fmt(r); tm.className="tm"+(!g.done&&r<=120?" low":""); if(cau) tm.textContent="00:00";
    [...$("#tk"+n).children].forEach((i,k)=>i.className=k<idx?"f":(k===idx&&!g.done&&!cau?"c":""));
    paintCtl(n);
    $("#sb"+n).style.width=sus+"%"; $("#sb"+n).style.background=sus>=70?"var(--bad)":sus>=40?"var(--amber)":"var(--ok)"; $("#sn"+n).textContent=sus;
    if(fin){ $("#pc"+n).textContent=g.piece||netPiece(n); $("#pt"+n).textContent="걸린 시간 "+tm.textContent+" · 의심 정도 "+sus; (got[g.piece||netPiece(n)]=got[g.piece||netPiece(n)]||[]).push(n); }
  }
  paintLimit();
  const q=queue(); $("#rq").textContent="시 확인 대기 "+q.length+"개"; $("#rq").classList.toggle("on",q.length>0);
  if(rvOpen) paintReview();
  const w=[...CONFIG.finalWord]; let all=true, cnt=0;
  w.forEach((c,i)=>{ const on=!!got[c]; $("#sl"+i).classList.toggle("on",on); $("#sg"+i).textContent=on?got[c].join("·")+"조":""; if(on)cnt++; else all=false; });
  $("#cnt").textContent=cnt+" / "+w.length+" 글자";
  if(all&&!celebrated){ celebrated=true; $("#dw").textContent=CONFIG.finalWord; $("#done").classList.add("show"); confetti(); }
  if(!all) celebrated=false;
}
// ---- 위장 시 검토: 학생이 낸 시(poems)와 선생님 판정(verdict)
function pending(n){ const p=(data.poems||{})[n], v=(data.verdict||{})[n], g=(data.groups||{})[n];
  return !!p&&!(g&&g.done)&&!(v&&v.for===p.t); }
// ---- 조별 관리: +5분, 관리 모드 (censor/방/ctl/조)
const ctlOf=n=>(data.ctl||{})[n]||{};
function paintCtl(n){ const c=ctlOf(n), b=$("#mode"+n), p=$("#p5"+n);
  b.classList.toggle("on",!!c.admin); b.textContent="관리 모드"; b.setAttribute("aria-pressed",String(!!c.admin));
  p.textContent="+5분"; p.setAttribute("aria-label",c.sec?"5분 더 주기 (총 +"+Math.round(c.sec/60)+"분)":"5분 더 주기");
  b.dataset.badge=c.admin?"켜짐":""; p.dataset.badge=c.sec?"총 +"+Math.round(c.sec/60)+"분":""; }   // 그림 버튼 위 꼬리표
function setCtl(n,patch){ data.ctl=data.ctl||{}; data.ctl[n]=Object.assign({},ctlOf(n),patch); paintCtl(n);
  netSetCtl(room,n,patch).then(ok=>{ if(!ok) alert("저장하지 못했습니다. 인터넷을 확인하세요."); }); }
function giveTime(n){ setCtl(n,{sec:(ctlOf(n).sec||0)+300}); }
async function toggleAdmin(n){ const on=!ctlOf(n).admin;
  if(on&&!await confirmAction("관리 모드 켜기",n+"조 기기에 관리 모드를 켤까요? 그 기기에서 단계를 건너뛸 수 있게 됩니다.","관리 모드 켜기")) return;
  setCtl(n,{admin:on}); }
// ---- 제한 시간(분): censor/방/settings/minutes. 학생 게임이 8초마다 받아 반영
const limit=()=>{ const m=data.settings&&data.settings.minutes; return Number.isInteger(m)?m:CONFIG.minutes; };
function paintLimit(){ $("#mv").textContent=limit(); }
async function setLimit(m){ m=Math.max(1,Math.min(120,m)); if(m===limit()) return;
  const G=data.groups||{}, now=Date.now();
  const hit=Object.keys(G).filter(n=>{ const g=G[n]; if(!g||!g.start||g.done||g.caught||(g.stage|0)>=4) return false;
    return m*60+(g.extra||0)-(now-g.start)/1000-(g.penalty||0)<=0; });
  if(m<limit()&&hit.length&&!await confirmAction("제한 시간 줄이기",hit.join(", ")+"조는 남은 시간이 없어 바로 붙잡힙니다(배드엔딩). 줄일까요?","시간 줄이기")) return;
  data.settings=Object.assign({},data.settings,{minutes:m}); paintLimit(); $("#lm").textContent="저장 중…";
  netSetMinutes(room,m).then(ok=>{ $("#lm").textContent=ok?"모든 조에 적용":"저장 실패"; }); }
$("#mdn").onclick=()=>setLimit(limit()-1);
$("#mup").onclick=()=>setLimit(limit()+1);
const queue=()=>Object.keys(data.poems||{}).map(Number).filter(pending).sort((a,b)=>data.poems[a].t-data.poems[b].t);
let rvOpen=0, rvAt=0;
function openReview(n){ const p=(data.poems||{})[n]; if(!p) return;
  rvOpen=n; rvAt=p.t; $("#rvg").textContent=n+"조"; $("#rvp").textContent=p.poem||""; $("#rvm").textContent=p.meaning||"";
  $("#rvd").open=false; $("#rv").classList.add("show"); paintReview(); }
function paintReview(){ const n=rvOpen, p=(data.poems||{})[n];
  if(!p){ return closeReview(); }
  if(p.t!==rvAt) return openReview(n);   // 학생이 시를 고쳐 다시 냈으면 새 시로
  const v=(data.verdict||{})[n], judged=v&&v.for===p.t, g=(data.groups||{})[n];
  $("#rvw").textContent=new Date(p.t).toLocaleTimeString("ko-KR",{hour:"2-digit",minute:"2-digit"})+" 제출";
  const open=!judged&&!(g&&g.done);
  ["#rvok","#rvcz","#rvvg"].forEach(b=>$(b).style.display=open?"":"none");
  const k=judged?(v.kind||(v.ok?"pass":"vague")):"";
  $("#rvs").textContent=judged?{pass:"통과시켰습니다",censor:"검열에 걸렸습니다 · 취조실로",vague:"의미가 모호해 돌려보냈습니다"}[k]:(g&&g.done?"이미 탈출했습니다":"");
  $("#rvs").style.color=k==="censor"?"var(--bad)":k==="vague"?"var(--amber)":"var(--ok)"; }
function closeReview(){ rvOpen=0; $("#rv").classList.remove("show"); }
const RVB=["#rvok","#rvcz","#rvvg"];
function judge(kind){ const n=rvOpen, p=(data.poems||{})[n]; if(!p) return;
  RVB.forEach(b=>$(b).disabled=true);
  netJudge(room,n,kind,p.t).then(done=>{ RVB.forEach(b=>$(b).disabled=false);
    if(!done){ $("#rvs").style.color="var(--bad)"; $("#rvs").textContent="저장하지 못했습니다. 인터넷이나 Firebase 규칙을 확인하세요."; return; }
    data.verdict=data.verdict||{}; data.verdict[n]={ok:kind==="pass",kind,for:p.t,t:Date.now()}; paint();
    const nx=queue()[0]; if(nx) openReview(nx); else closeReview(); }); }
$("#rvok").onclick=()=>judge("pass");
$("#rvcz").onclick=()=>judge("censor");
$("#rvvg").onclick=()=>judge("vague");
$("#rvx").onclick=closeReview;
$("#rv").onclick=e=>{ if(e.target.id==="rv") closeReview(); };
document.addEventListener("keydown",e=>{ if(e.key==="Escape") closeReview(); });
$("#rq").onclick=()=>{ const n=queue()[0]; if(n) openReview(n); };
function confetti(){ const cols=["#e0a93f","#6bb585","#e5484d","#4a90e2","#f1efe8"];
  for(let i=0;i<90;i++){ const e=document.createElement("i"); e.className="conf"; e.style.left=Math.random()*100+"vw"; e.style.background=cols[i%5];
    e.style.animationDuration=(2.5+Math.random()*3)+"s"; e.style.animationDelay=Math.random()*1.5+"s"; document.body.appendChild(e); setTimeout(()=>e.remove(),8000); } }
// ---- 실시간 연결: Firebase REST 스트리밍(EventSource)
let es=null;
function setPath(obj,path,val,merge){ const p=path.split("/").filter(Boolean); if(!p.length){ return merge&&val&&obj? Object.assign(obj,val):(val||{}); }
  let o=obj; for(let i=0;i<p.length-1;i++){ o[p[i]]=o[p[i]]||{}; o=o[p[i]]; }
  const k=p[p.length-1]; if(val===null) delete o[k]; else if(merge&&typeof val==="object"&&o[k]) Object.assign(o[k],val); else o[k]=val; return obj; }
function connect(){
  if(es) es.close(); data={}; closeReview(); paint();
  es=new EventSource(netUrl(room));
  es.onopen=()=>{ $("#cd").className="dot on"; $("#ct").textContent="실시간 연결됨"; };
  es.onerror=()=>{ $("#cd").className="dot"; $("#ct").textContent="연결 안 됨 · 다시 시도 중"; };
  es.addEventListener("put",e=>{ const m=JSON.parse(e.data); data=setPath(data,m.path,m.data,false); paint(); });
  es.addEventListener("patch",e=>{ const m=JSON.parse(e.data); data=setPath(data,m.path,m.data,true); paint(); });
}
function start(r){ room=r; try{localStorage.setItem("censor-room",room);}catch(e){}
  $("#setup").classList.remove("show"); $("#rc").textContent=room;
  const link=location.href.split("?")[0].replace(/teacher\.html$/,"escape_room.html").replace(/\/tv(\/index\.html)?\/?$/,"/game/")+"?room="+encodeURIComponent(room);
  $("#lk").textContent=link.replace(/^https?:\/\//,""); $("#qr").innerHTML="";
  try{ new QRCode($("#qr"),{text:link,width:92,height:92,correctLevel:QRCode.CorrectLevel.M}); }catch(e){ $("#qr").style.display="none"; }
  connect(); }
$("#sg").onclick=()=>{ const v=$("#si").value.trim(); if(netRoomOk(v)) start(v); else $("#si").focus(); };
$("#sr").onclick=()=>start(String(Math.floor(1000+Math.random()*9000)));
$("#newroom").onclick=async()=>{ if(await confirmAction("새 검열실 개설","새 방 번호로 이동할까요? 현재 방의 기록은 그대로 남습니다.","새 방으로 이동")) start(String(Math.floor(1000+Math.random()*9000))); };
$("#clear").onclick=async()=>{ const target=room; if(await confirmAction("진행 초기화","이 방의 모든 조 진행 상황을 지웁니다. 되돌릴 수 없습니다. 초기화할까요?","진행 초기화")) netClear(target).then(()=>{celebrated=false;}); };
$("#dx").onclick=()=>$("#done").classList.remove("show");
build();
const qs=document.createElement("script"); qs.src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"; qs.onload=init; qs.onerror=init; document.head.appendChild(qs);
function init(){ if(netRoomOk(room)) start(room); else $("#setup").classList.add("show"); setInterval(paint,1000); }
</script>
