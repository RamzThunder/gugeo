<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>gugeo.party</title>
<meta name="description" content="국어 수업 활동 모음">
<link rel="icon" href="/favicon.ico" sizes="any"><link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png"><link rel="apple-touch-icon" href="/apple-touch-icon.png">
<style>
:root{--bg:#f6f1e7;--fg:#2b2620;--mute:#6f665a;--card:#fffdf8;--line:#e2d8c6;--accent:#9b2c2c}
@media (prefers-color-scheme:dark){:root{--bg:#16171b;--fg:#ece6da;--mute:#a49b8d;--card:#1f2026;--line:#33343c;--accent:#e07a6a}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font-family:"Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",sans-serif;line-height:1.6}
main{max-width:720px;margin:0 auto;padding:56px 16px 64px}
h1{font-size:34px;margin:0 0 4px;letter-spacing:-.5px}
.sub{color:var(--mute);margin:0 0 36px}
.list{display:grid;gap:16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:20px 22px}
.card h2{font-size:20px;margin:0 0 4px}
.card p{margin:0 0 14px;color:var(--mute);font-size:15px}
.links{display:flex;gap:10px;flex-wrap:wrap}
.links a{display:inline-block;padding:8px 16px;border-radius:8px;border:1px solid var(--line);color:var(--fg);text-decoration:none;font-size:15px}
.links a.main{background:var(--accent);border-color:var(--accent);color:#fff}
footer{margin-top:48px;color:var(--mute);font-size:13px}
</style>
</head>
<body>
<main>
  <h1>gugeo.party</h1>
  <p class="sub">국어 수업 활동 모음</p>
  <div class="list">
    <!-- 활동을 더할 때는 아래 card 하나를 복사해서 고치면 됩니다 -->
    <section class="card">
      <h2>검열국을 탈출하라</h2>
      <p>일제강점기 문학 방탈출. 검열관으로 위장해 위장 시를 원고 더미에 섞어 내보내라.</p>
      <div class="links">
        <a class="main" href="https://censor.gugeo.party/game/">학생 입장</a>
        <a href="https://censor.gugeo.party/tv/">교실 TV</a>
      </div>
    </section>
  </div>
  <footer>gugeo.party</footer>
</main>
</body>
</html>
