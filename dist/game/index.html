<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<!-- 사이트 아이콘(파비콘): favicon/ 폴더, build.py가 dist 맨 위로 복사 -->
<link rel="icon" href="/favicon.ico" sizes="any"><link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png"><link rel="apple-touch-icon" href="/apple-touch-icon.png">
<title>검열국 탈출</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
html{touch-action:manipulation}
/* 글꼴은 fonts.js 에서 정합니다 (자리별 글꼴 이름만 바꾸면 됨) */

/* Layout: 한 화면 한 단계. 상단 상태줄(조·남은 시간·힌트) + 본문 카드 + 하단 교사 버튼.
   Look: 검열실 책상. 짙은 먹색 바탕에 원고지색 종이, 삭제 도장은 붉은색 한 곳에만 쓴다. */
:root{
  --bg:#13151a; --panel:#1c1f26; --line:#2f333d; --fg:#ece7da; --mute:#9aa0ad;
  --paper:#ebe3cd; --ink:#1d1b17; --stamp:#d2402f; --amber:#e0a93f; --ok:#6bb585;
  --sans:"Galmuri11","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --serif:"Galmuri11","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{min-height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--sans);font-size:16px;line-height:1.65;margin:0;
  padding-block:0;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:860px;margin:0 auto;padding-block:16px 56px;display:flex;flex-direction:column;gap:16px}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid var(--amber);outline-offset:2px}
h1,h2,h3{margin:0;text-wrap:balance;line-height:1.3}
h1{font-family:var(--serif);font-size:clamp(28px,6vw,44px);letter-spacing:.02em}
h2{font-family:var(--serif);font-size:clamp(21px,4vw,26px)}
h3{font-size:15px;color:var(--mute);font-weight:500;letter-spacing:.04em}
p{margin:0}
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;display:flex;gap:12px;align-items:center;flex-wrap:wrap;
  background:var(--bg);border-bottom:1px solid var(--line);padding-block:10px}
.bar .grp{font-weight:700}
.bar .time{margin-left:auto;font-variant-numeric:tabular-nums;font-size:22px;font-weight:700;letter-spacing:.03em}
.bar .time.over{color:var(--stamp)}
.sus{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--mute)}
.sus .g{width:90px;height:8px;background:var(--line);display:block;overflow:hidden}
.sus .g i{display:block;height:100%;background:var(--ok);width:0}
.sus.hi .g i{background:var(--amber)} .sus.max .g i{background:var(--stamp)}
.scene{width:100%;height:auto;display:block;border:1px solid var(--line);background:#0e1014}
.hs{cursor:pointer;outline:none}
.hs .hit{fill:transparent;stroke:transparent;stroke-width:3}
.hs .cut{transform-box:fill-box;transform-origin:50% 100%;transition:transform .12s steps(3),filter .12s;pointer-events:none}
.hs:hover .cut,.hs:focus-visible .cut,.hs:active .cut{transform:scale(1.045);filter:drop-shadow(2px 0 0 #ffd84a) drop-shadow(-2px 0 0 #ffd84a) drop-shadow(0 2px 0 #ffd84a) drop-shadow(0 -2px 0 #ffd84a) brightness(1.18)}
.hs:active .cut{transform:scale(.99)}
.hs.tgt .cut{animation:tgl 1.6s steps(2) infinite}
@keyframes tgl{0%,100%{filter:none}50%{filter:drop-shadow(1.5px 0 0 #ffd84a) drop-shadow(-1.5px 0 0 #ffd84a) drop-shadow(0 1.5px 0 #ffd84a) drop-shadow(0 -1.5px 0 #ffd84a) brightness(1.1)}}
.pulse{fill:#e0a93f;animation:pl 1.6s ease-in-out infinite;pointer-events:none}
@keyframes pl{0%,100%{opacity:.2}50%{opacity:.95}}
.cap{font-size:14px;color:var(--mute);min-height:1.6em}
.toast{background:var(--panel);border:1px solid var(--line);padding:10px 14px;min-height:3.4em;font-size:15px}
.toast.new{border-color:var(--amber)}
.inv{display:flex;gap:8px;flex-wrap:wrap;align-items:center;font-size:14px;color:var(--mute)}
.ico{height:22px;width:auto;vertical-align:middle;margin-right:6px}
.inv span.it{border:1px solid var(--amber);color:var(--fg);padding:3px 10px;background:#2a2619}
.vn{width:100%;max-width:808px;margin:0 auto;display:flex;flex-direction:column;gap:0;padding-top:12px}
.vn svg{width:100%;height:auto;display:block;border:1px solid var(--line);background:#0e1014}
.vbox{background:#181b22;border:1px solid var(--line);border-top:3px solid var(--amber);padding:14px 18px 16px;position:relative;min-height:150px;display:flex;flex-direction:column;gap:10px;cursor:pointer}
.vnm{font-family:var(--serif);font-weight:700;color:var(--amber);min-height:1.5em;letter-spacing:.04em}
.vtx{font-size:clamp(16px,2.6vw,19px);line-height:1.8;min-height:3.6em}
.vtx.nar{color:var(--mute)}
.vch{display:flex;flex-direction:column;gap:8px}
.vch button{text-align:left;background:#232733;border:1px solid var(--line);padding:11px 14px;min-height:46px}
.vch button:hover,.vch button:focus-visible{border-color:var(--amber)}
.vnx{position:absolute;right:14px;bottom:8px;color:var(--amber);animation:pl 1.2s infinite}
.vtop{display:flex;justify-content:space-between;color:var(--mute);font-size:13px;padding-bottom:8px}
.vtop button{background:none;border:0;color:var(--mute);text-decoration:underline}
.vflash{color:#ff9a8c;font-size:14px;min-height:1.3em}
.panel{position:fixed;inset:0;z-index:15;background:var(--bg);overflow:auto;padding-top:env(safe-area-inset-top,0px);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.pwrap{max-width:860px;margin:0 auto;padding-bottom:48px;display:flex;flex-direction:column;gap:14px}
.panel .bar{top:0}
.pbody{display:flex;flex-direction:column;gap:14px}
.steps{display:flex;gap:6px}
.steps i{width:26px;height:6px;background:var(--line);display:block}
.steps i.on{background:var(--amber)} .steps i.done{background:var(--ok)}
.card{background:var(--panel);border:1px solid var(--line);padding:18px;display:flex;flex-direction:column;gap:14px}
.story{color:var(--mute);font-size:15px}
.btn{background:var(--amber);color:#1b1608;border:0;padding:12px 20px;font-weight:700;min-height:46px}
.btn.ghost{background:transparent;color:var(--fg);border:1px solid var(--line)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,380px),1fr));gap:14px}
.paper{background:var(--paper);color:var(--ink);font-family:var(--serif);padding:16px 18px;position:relative;min-width:0;
  display:flex;flex-direction:column;gap:10px}
.paper .no{font-family:var(--sans);font-size:12px;color:#6a6454;letter-spacing:.08em}
/* 1단계 카드: 시인·작품 이름, 힌트 (처음부터 보임) */
.paper .poet{font-family:var(--sans);font-size:15px;font-weight:700;color:#5a3a1c;margin-top:-4px}
.paper .chint{font-family:var(--sans);font-size:14px;line-height:1.6;color:#4a3b22;background:#efe2bd;border-left:4px solid var(--amber);padding:7px 10px;word-break:keep-all}
.paper .txt{font-size:18px;line-height:1.9;word-break:keep-all}
.tok{display:inline-block;padding:0 3px;margin:0 1px;border-bottom:2px dotted #8a8268;cursor:pointer;background:none;border-top:0;border-left:0;border-right:0;font:inherit;color:inherit}
.tok.sel{background:#f1c75b;border-bottom-color:#8a5a00}
.tok.hint{outline:2px solid var(--stamp)}
/* 미니게임 */
.mdrawer{position:relative;width:100%;aspect-ratio:5/3;border:4px solid #0a0b0e;box-shadow:inset 0 0 0 3px #3b2a1a,inset 0 18px 30px rgba(0,0,0,.55),6px 6px 0 rgba(0,0,0,.5);
  background:#6b4a2c repeating-linear-gradient(90deg,rgba(0,0,0,.08) 0 3px,transparent 3px 46px);background-size:cover;background-position:center;overflow:hidden}
.mitem,.mkey{position:absolute;padding:0;border:0;background:none;cursor:pointer;transform:rotate(var(--r,0deg));transition:transform .4s ease-in,opacity .4s ease-in}
.mitem:not(.img){background:#e8dfc6;border:3px solid #2a2417;box-shadow:3px 3px 0 rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center;color:#2a2417;font-size:clamp(11px,2.2vw,15px);line-height:1.2;text-align:center}
.mitem:nth-child(3n):not(.img){background:#c9b98f}.mitem:nth-child(4n):not(.img){background:#9a8b6a;color:#fff6dd}
.mitem img,.mkey img{width:100%;height:100%;object-fit:contain;display:block;image-rendering:pixelated}
.mitem:hover,.mitem:focus-visible{filter:brightness(1.12)}
.mitem.gone{transform:translateX(var(--dx,80%)) rotate(calc(var(--r,0deg) + 25deg));opacity:0;pointer-events:none}
.mkey.seen{animation:pl 1.2s infinite;filter:drop-shadow(0 0 6px #ffd84a)}
.mboss .spr0{transition:filter .2s}
.mboss.away .spr0{filter:brightness(.25) saturate(0)}
.mboss.away.hasback .spr0{filter:none}
.mboss.hasback:not(.look) .sw{height:auto;width:96%;right:2%}
.mboss.hasback:not(.look) .sw .spr0{width:100%;height:auto}
.mbub{position:absolute;right:30%;top:8%;font-family:var(--serif);font-weight:700;font-size:clamp(18px,4vw,30px);color:#1b1608;background:#fff6dd;border:3px solid #0a0b0e;padding:2px 12px;line-height:1.3}
.mbub:empty{display:none}
.mboss.look .mbub{background:var(--stamp);color:#fff}
.mhold{position:absolute;left:50%;bottom:5%;transform:translateX(-50%);z-index:6;width:min(78%,440px);min-height:clamp(52px,11cqw,80px);display:flex;align-items:center;justify-content:center;gap:10px;font:700 clamp(16px,3.6cqw,26px)/1.2 var(--serif);color:#fff;text-shadow:0 2px 0 rgba(0,0,0,.7);background:linear-gradient(90deg,var(--amber) var(--p,0%),rgba(20,22,28,.9) var(--p,0%));border:3px solid #0a0b0e;box-shadow:0 4px 0 #0a0b0e;cursor:pointer;touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}
.mhold .ico{width:1.6em;height:1.6em;object-fit:contain}
.mhold.on{transform:translateX(-50%) translateY(3px);box-shadow:0 1px 0 #0a0b0e;filter:brightness(1.15)}
.mhold.lock{opacity:.55}
.mboss{touch-action:none}
.roomin{width:100%;font:700 22px var(--serif);padding:12px 14px;background:#0f1116;color:#fff;border:3px solid #0a0b0e;letter-spacing:.1em}
.wirewrap{line-height:0}   /* 폭·테두리는 .pixwrap(검열실 그림 화면)과 같음 */
.wirewrap canvas{width:100%;height:auto;aspect-ratio:810/429;display:block;image-rendering:auto}
.wirewrap svg{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none;user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent}
.wirewrap svg image{image-rendering:auto}
.wirewrap.shake{animation:shake .3s}
.mrib{display:flex;align-items:center;gap:10px;font-size:14px;color:var(--mute)}
.mrib .g{flex:1;max-width:320px;height:12px;background:var(--line);display:block;overflow:hidden;border:2px solid #0a0b0e}
.mrib .g i{display:block;height:100%;width:0;background:var(--amber);transition:width .15s}
.paper .mk{font-weight:700;color:#7a1d10;border-bottom:3px solid var(--amber);padding:0 1px}
.choices{display:flex;gap:6px;flex-wrap:wrap;font-family:var(--sans)}
.ch{background:#fff8e4;border:1.5px solid #8a8268;color:var(--ink);padding:7px 12px;font-size:14px;min-height:40px}
.ch.on{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.paper.ok{outline:3px solid var(--ok)} .paper.bad{outline:3px solid var(--stamp);animation:shake .35s}
.why{font-family:var(--sans);font-size:14px;background:#d9ead9;color:#173a22;padding:8px 10px}
.msg{font-size:14px;min-height:1.4em}
.msg.bad{color:#ff9a8c} .msg.ok{color:var(--ok)}
.stamp{position:absolute;right:10px;top:34%;font-family:var(--serif);font-weight:700;font-size:34px;color:var(--stamp);
  border:4px solid var(--stamp);padding:0 12px;transform:rotate(-12deg);opacity:0;pointer-events:none;background:rgba(235,227,205,.5)}
.stamp.show{animation:stampIn .5s ease-out forwards}
.q{display:flex;flex-direction:column;gap:8px}
.opt{text-align:left;background:var(--panel);border:1px solid var(--line);padding:12px 14px;min-height:46px}
.opt.on{border-color:var(--amber);background:#2a2619}
.opt.good{border-color:var(--ok);background:#1d2f24}
.opt.no{border-color:var(--stamp)}
textarea,input[type=text],input[type=password]{width:100%;font:inherit;background:#0f1115;color:var(--fg);border:1px solid var(--line);padding:12px}
textarea{min-height:92px;resize:vertical;font-family:var(--serif);font-size:18px}
.banned{display:flex;gap:6px;flex-wrap:wrap}
.banned span{border:1px solid var(--stamp);color:#ff9a8c;padding:1px 10px;font-size:14px}
.banned span.hit{background:var(--stamp);color:#fff;text-decoration:line-through}
.glist{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.glist button{background:var(--panel);border:1px solid var(--line);padding:14px 0;font-size:20px;font-weight:700}
.glist button.on{border-color:var(--amber);background:#2a2619}
.big{font-family:var(--serif);font-size:clamp(64px,22vw,120px);line-height:1;color:var(--amber);text-align:center;border:3px solid var(--amber);padding:18px;align-self:center;min-width:1.7em}
.stats{display:flex;gap:18px;flex-wrap:wrap;color:var(--mute)}
.stats b{color:var(--fg);font-variant-numeric:tabular-nums}
.foot{display:flex;justify-content:space-between;gap:10px;color:var(--mute);font-size:13px}
.foot button{background:none;border:0;color:var(--mute);text-decoration:underline;padding:6px}
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.7);display:flex;align-items:flex-start;justify-content:center;padding:16px;z-index:20;overflow:auto}
.overlay .card{width:min(100%,640px);margin-top:20px}
#tbar{position:fixed;right:12px;bottom:calc(12px + env(safe-area-inset-bottom,0px));z-index:30;display:flex;gap:6px;align-items:center;background:#2a1f0c;border:3px solid #0a0b0e;box-shadow:inset 0 0 0 2px var(--amber),4px 4px 0 rgba(0,0,0,.5);padding:6px 8px;font-size:13px;color:var(--amber)}
#tbar button{background:var(--amber);color:#1b1608;border:2px solid #0a0b0e;padding:6px 10px;font:inherit;font-weight:700;cursor:pointer;min-height:36px}
#tbar button#tmenu{background:#3a3f4c;color:var(--fg)}
.tjump .btn{padding:8px 12px 11px;font-size:14px}
.key{font-size:14px;color:var(--fg)} .key li{margin-bottom:4px}
.note{font-size:13px;color:var(--mute)}
.stamp.pass{color:#2f7a4c;border-color:#2f7a4c;font-size:28px}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
@keyframes stampIn{0%{opacity:0;transform:rotate(-12deg) scale(2.4)}100%{opacity:.95;transform:rotate(-12deg) scale(1)}}

/* ===== 도트 스타일 ===== */
body{font-size:16.5px;line-height:1.7;-webkit-font-smoothing:none}
h1,h2{font-weight:700;text-shadow:3px 3px 0 #000}
h1{letter-spacing:0}
.pixwrap{max-width:808px;margin:0 auto;width:100%;position:relative;border:4px solid #0a0b0e;box-shadow:0 0 0 2px #3a3f4c,6px 6px 0 rgba(0,0,0,.5);background:#0e1014;line-height:0}
.pix{width:100%;height:auto;aspect-ratio:5/3;display:block;image-rendering:pixelated;image-rendering:crisp-edges;image-rendering:pixelated}
.bgimg{width:100%;height:auto;aspect-ratio:800/480;display:block;image-rendering:auto}  /* 그림이 뜨기 전에도 칸 높이를 잡아 둠 */
.stage{position:relative;container-type:inline-size;line-height:1}
.sw{position:absolute;right:3%;bottom:0;height:var(--h,85%);display:block;}
.sw .spr0{height:100%;width:auto;display:block;max-width:none}
.sw .pt{position:absolute;height:auto;image-rendering:auto}
@keyframes br{0%,100%{transform:scale(1) translateY(0)}50%{transform:scale(1.008) translateY(-1.5px)}}
.spr{position:absolute;right:3%;bottom:0;height:var(--h,85%);width:auto;max-width:60%;object-fit:contain;object-position:right bottom}
.sign{position:absolute;left:41.5%;width:17%;top:34.6%;height:8.6%;display:flex;align-items:center;justify-content:center;font-weight:700;color:#f1e6c8;font-size:4.3cqw;line-height:1;text-shadow:2px 2px 0 #000;letter-spacing:.05em}
.hot{position:absolute;inset:0;width:100%;height:100%}
.hs .hit{stroke:none}
.pulse{fill:#ffd84a;stroke:#1a1405;stroke-width:3}
.vn .pixwrap{box-shadow:0 0 0 2px #3a3f4c}
.vcap{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(6,7,10,.55);cursor:pointer;animation:capfade 3.4s ease-in-out forwards}
.vcap span{font-family:var(--serif);font-weight:700;color:#f1e6c8;font-size:clamp(20px,4.4vw,34px);line-height:1.4;letter-spacing:.08em;text-align:center;padding:0 16px;text-shadow:2px 2px 0 #000}
@keyframes capfade{0%{opacity:0}22%,78%{opacity:1}100%{opacity:0}}
.card,.toast,.paper,.opt,.vch button,.ch,.glist button,.inv span.it,.banned span{border-radius:0}
.card{border:3px solid #0a0b0e;box-shadow:inset 0 0 0 2px var(--line),5px 5px 0 rgba(0,0,0,.5)}
.toast{border:3px solid #0a0b0e;box-shadow:inset 0 0 0 2px var(--line);font-size:16.5px}
.toast.new{box-shadow:inset 0 0 0 2px var(--amber)}
.btn{border:3px solid #17120a;box-shadow:inset 0 -5px 0 #a9761a,3px 3px 0 rgba(0,0,0,.55);padding:10px 20px 14px}
.btn:active{transform:translate(2px,2px);box-shadow:inset 0 -3px 0 #a9761a,1px 1px 0 rgba(0,0,0,.55)}
.btn.ghost{border:3px solid #3a3f4c;box-shadow:inset 0 -4px 0 #20232b,3px 3px 0 rgba(0,0,0,.55)}
.paper{border:3px solid #2a2417;box-shadow:inset 0 0 0 2px #cfc3a2,4px 4px 0 rgba(0,0,0,.5)}
.ch{border-width:3px}.ch.on{box-shadow:inset 0 -3px 0 #000}
.vbox{border:4px solid #0a0b0e;border-top:4px solid #0a0b0e;box-shadow:inset 0 0 0 3px var(--amber),6px 6px 0 rgba(0,0,0,.5);padding:18px 22px 20px}
.vtx{font-size:clamp(16.5px,3vw,22px);line-height:1.75}
.vnm{display:inline-block;align-self:flex-start;background:var(--amber);color:#1b1608;padding:2px 12px;font-weight:700;min-height:0;margin-top:-34px;border:3px solid #0a0b0e}
.vnm:empty{display:none}
.title-pix{display:flex;flex-direction:column;gap:8px}
.big{border:4px solid #0a0b0e;box-shadow:inset 0 0 0 3px var(--amber),6px 6px 0 rgba(0,0,0,.5);text-shadow:4px 4px 0 #000}
.bar{border-bottom:3px solid var(--line)}
.sus .g{border:2px solid #0a0b0e;height:12px}
.steps i{height:10px;border:2px solid #0a0b0e}
textarea{font-size:16.5px}
.opt{border-width:3px}

/* ===== 2단계 도장: 그림 도장 (교실 TV와 같은 모양). 삭제 = 빨강, 통과 = 초록 ===== */
.stamp,.stamp.pass{width:clamp(92px,30%,150px);aspect-ratio:600/246;height:auto;padding:0;border:0;font-size:0;color:transparent;
  background:url("img/stamp_delete.webp") center/contain no-repeat transparent}
.stamp.pass{aspect-ratio:600/217;background-image:url("img/stamp_pass.webp")}

/* ===== 글꼴별 크기 조정 (글꼴 종류는 fonts.js) ===== */
.paper .txt{font-size:21px;line-height:1.75}
textarea{font-size:20px;line-height:1.6}
.vcap span{font-size:clamp(24px,5.4vw,42px);letter-spacing:.04em}
</style>
<script>
/* ===== 글꼴 설정 =====
   이 파일만 고치면 게임과 교실 TV의 글꼴이 바뀝니다. 고친 뒤 python3 build.py 를 실행하세요.

/* ---------- 여기부터는 고치지 않아도 됩니다 ---------- */
// 자리마다 화면의 어느 부분인지 (CSS 선택자)
const FONT_SLOTS={
  기본:"body,button,input,.choices,.paper .no",
  본문:".vtx,.vch button,.story,.note,.msg,.toast,.cap,.card p,.key,.why",
  제목:"h1,h2", 도장:".stamp", 종이글:".paper .txt", 시쓰기:"textarea", 자막:".vcap span",
  이름표:".vnm,.mbub", 글자조각:".big", 조번호:".bar .grp,.vtop span",
  TV기본:"body,button,input", TV숫자:".code b,.lim b", TV남은시간:".g .tm", TV의심도숫자:".g .sus b",
  TV창제목:"#confirm-title,#setup h2", TV창본문:"#confirm-message,#action-confirm button,#setup input,#setup button",
  TV조번호:".g .no", TV통신:"#ct", TV글자조각:".piece .ch", TV모은글자:".slot",
  TV추가시간:'.g .ctl button[id^="p5"][data-badge]:not([data-badge=""]):after',
  TVQR번호:"#qrbig .qr-room", TVQR주소:"#qrbig .qr-link,#qrbig .qr-close",
  TV시:"#rv pre", TV축하:"#done .w"
};
(function applyFonts(){
  const dir=document.documentElement.getAttribute("data-fontdir")||"fonts/";
  const fam=n=>"F_"+Object.keys(FONT_LIST).indexOf(n);
  const fmt=f=>/\.woff2$/i.test(f)?"woff2":/\.woff$/i.test(f)?"woff":/\.otf$/i.test(f)?"opentype":"truetype";
  const tv=!!document.querySelector("#rv"), mine=k=>tv?/^TV/.test(k):!/^TV/.test(k);
  const used=[...new Set(Object.keys(FONT_USE).filter(mine).map(k=>FONT_USE[k]))].filter(n=>FONT_LIST[n]);
  let css="";
  used.forEach(n=>{ const f=FONT_LIST[n]; if(f.system) return;
    [[f.file,400],[f.bold,700]].forEach(([file,w])=>{ if(!file) return;
      const url=dir+encodeURI(file);
      const adj=f.size&&f.size!==100?`size-adjust:${f.size}%;`:"";   // 글꼴별 크기 배율
      css+=`@font-face{font-family:"${fam(n)}";font-weight:${w};src:url("${url}") format("${fmt(file)}");font-display:block;${adj}}\n`;
      const l=document.createElement("link"); l.rel="preload"; l.as="font"; l.href=url; l.crossOrigin="anonymous"; document.head.appendChild(l); }); });
  Object.keys(FONT_USE).filter(mine).forEach(k=>{ const n=FONT_USE[k], f=FONT_LIST[n], sel=FONT_SLOTS[k];
    if(!f||!sel){ console.warn("글꼴 설정 확인:",k,n); return; }
    const stack=f.system?f.system:`"${fam(n)}","Apple SD Gothic Neo","Malgun Gothic",sans-serif`;
    // 게임: 굵은 꼴이 없는 글꼴은 억지로 굵게 만들지 않음. TV: 디자인에서 정한 굵기 그대로 둠
    css+=`${sel}{font-family:${stack};${!tv&&!f.system&&!f.bold?"font-synthesis:none;font-weight:400;":""}}\n`;
    if(k==="기본"&&!tv) css+=`:root{--sans:${stack};--serif:${stack}}\n`; });
  const st=document.createElement("style"); st.id="font-settings"; st.textContent=css; document.head.appendChild(st);
})();

</script>

<script>
/* 교실 TV(teacher.html)로 진행 상황을 보내는 코드. 학생 게임이 쓰고, teacher.html도 같이 씁니다.
   Firebase Realtime Database의 REST 주소만 쓰므로 별도 라이브러리는 없습니다.
   인터넷이 막히거나 방 번호가 없으면 아무 일도 하지 않고 게임은 그대로 돌아갑니다. */
const NET={
  db:"https://gugeo-c23ae-default-rtdb.asia-southeast1.firebasedatabase.app",
  root:"censor"
};
const netRoomOk=r=>/^[0-9A-Za-z가-힣-]{2,12}$/.test(r||"");
/* 글자 조각: 조마다 받는 글자를 방마다 다르게 섞음.
   방 번호 + 초기화 기록(resetId)을 씨앗으로 섞어서, 같은 방의 학생 기기와 TV는 늘 같은 순서를 얻음 (글자가 겹치지 않음).
   새 검열실 개설·기록 초기화를 하면 resetId가 바뀌어 순서도 새로 섞임. */
function netOrder(seed){
  const w=[...CONFIG.finalWord]; let h=2166136261;
  for(const c of String(seed)){ h^=c.codePointAt(0); h=Math.imul(h,16777619)>>>0; }
  const rnd=()=>{ h=(h+0x6D2B79F5)>>>0; let t=h; t=Math.imul(t^t>>>15,t|1); t^=t+Math.imul(t^t>>>7,t|61); return ((t^t>>>14)>>>0)/4294967296; };
  for(let i=w.length-1;i>0;i--){ const j=Math.floor(rnd()*(i+1)); [w[i],w[j]]=[w[j],w[i]]; }
  return w;
}
const netPieceSeed=(room,rid)=>(room||"")+"|"+(rid||"none");
const netPiece=(g,seed)=>{ const w=netOrder(seed!=null?seed:(typeof S!=="undefined"?netPieceSeed(S.room,S.resetId):"")); return w[(g-1)%w.length]; };
const netUrl=(room,g)=>`${NET.db}/${NET.root}/${encodeURIComponent(room)}${g?"/groups/"+g:""}.json`;
let _netSig="", _netAt=0;
function netPush(force){
  if(typeof S==="undefined"||!netRoomOk(S.room)||!S.group) return;
  const d={stage:S.stage|0, where:(typeof curKey!=="undefined"&&curKey)||"", sus:Math.min(100,S.sus|0), hints:S.hints|0, grilled:S.grilled|0,
    start:S.start||0, penalty:S.penalty|0, extra:S.extra|0, min:CONFIG.minutes, done:S.done||0, caught:S.caught||0, epi:S.done&&S.epi?1:0, piece:S.done?netPiece(S.group):"", t:Date.now()};
  const sig=JSON.stringify(Object.assign({},d,{t:0})), now=Date.now();
  if(!force&&sig===_netSig&&now-_netAt<10000) return;
  _netSig=sig; _netAt=now;
  try{ fetch(netUrl(S.room,S.group),{method:"PUT",body:JSON.stringify(d),keepalive:true}).catch(()=>{}); }catch(e){}
}
function netClear(room,g){ if(!netRoomOk(room)) return Promise.resolve();
  const del=u=>{ try{ return fetch(u,{method:"DELETE"}).catch(()=>{}); }catch(e){ return Promise.resolve(); } };
  // 방 전체는 규칙상 한 번에 못 지우므로, 조마다 groups·poems·verdict 칸을 한 요청으로 비웁니다
  if(!g){ const d={}; for(let n=1;n<=Math.max(CONFIG.groups,20);n++) ["groups","poems","verdict","ctl"].forEach(k=>d[k+"/"+n]=null);
    try{ return fetch(netUrl(room),{method:"PATCH",body:JSON.stringify(d)}).catch(()=>{}); }catch(e){ return Promise.resolve(); } }
  return Promise.all([del(netUrl(room,g)),del(netKindUrl(room,"poems",g)),del(netKindUrl(room,"verdict",g)),del(netKindUrl(room,"ctl",g))]); }
// 3단계 위장 시: 학생이 censor/방/poems/조 에 올리고, TV가 censor/방/verdict/조 에 판정을 적습니다.
// kind: pass(통과) · censor(검열에 걸림: 상관 등장, 취조실) · vague(의미 모호: 접선책이 돌려보냄)
// verdict.for 에는 판정한 시의 t를 적어, 시를 고쳐 다시 내면 예전 판정은 무시됩니다.
const netKindUrl=(room,kind,g)=>`${NET.db}/${NET.root}/${encodeURIComponent(room)}/${kind}/${g}.json`;
function netPoem(){
  if(typeof S==="undefined"||!netRoomOk(S.room)||!S.group||!S.poem) return Promise.resolve(false);
  const d={poem:S.poem.slice(0,500),meaning:(S.meaning||"").slice(0,300),t:S.poemAt||Date.now()};
  try{ return fetch(netKindUrl(S.room,"poems",S.group),{method:"PUT",body:JSON.stringify(d)}).then(r=>r.ok).catch(()=>false); }catch(e){ return Promise.resolve(false); }
}
function netVerdict(room,g){
  try{ return fetch(netKindUrl(room,"verdict",g),{cache:"no-store"}).then(r=>r.ok?r.json():null).catch(()=>null); }catch(e){ return Promise.resolve(null); }
}
function netJudge(room,g,kind,forT){
  try{ return fetch(netKindUrl(room,"verdict",g),{method:"PUT",body:JSON.stringify({ok:kind==="pass",kind,for:forT,t:Date.now()})}).then(r=>r.ok).catch(()=>false); }catch(e){ return Promise.resolve(false); }
}
setInterval(()=>netPush(false),4000);
// 제한 시간: TV에서 바꾼 분(censor/방/settings/minutes)을 8초마다 받아 CONFIG.minutes에 반영
const netSetUrl=room=>`${NET.db}/${NET.root}/${encodeURIComponent(room)}/settings.json`;
function netSettings(){
  if(typeof S==="undefined"||!netRoomOk(S.room)) return;
  const room=S.room;
  try{ fetch(netSetUrl(room),{cache:"no-store"}).then(r=>r.ok?r.json():null).then(j=>{
    j=j||{}; if(S.room!==room) return;
    // TV의 '기록 초기화'·'새 검열실 개설': resetId가 바뀌면 진행 중이던 게임을 처음으로 (closed면 방 번호도 지움)
    const rid=j.resetId||"none";
    if(S.resetId==null){ S.resetId=rid; save(); }
    else if(rid!==S.resetId){ S.resetId=rid;
      if(S.group&&typeof roomReset==="function"){ roomReset(!!j.closed); return; }   // 모둠을 고른 뒤라면 처음으로
      if(j.closed){ S.room=""; } save(); if(j.closed&&typeof render==="function") render(); return; }
    const m=j.minutes; if(!Number.isInteger(m)||m<1||m>120||m===CONFIG.minutes) return;
    CONFIG.minutes=m; if(typeof paintClock==="function") paintClock(); netPush(true);
  }).catch(()=>{}); }catch(e){}
}
function netSetMinutes(room,m){
  try{ return fetch(netSetUrl(room),{method:"PATCH",body:JSON.stringify({minutes:m})}).then(r=>r.ok).catch(()=>false); }catch(e){ return Promise.resolve(false); }
}
// TV: 이 방의 모든 진행 기록을 지우고, 학생 게임에도 '처음으로' 신호를 보냄. close=true면 방을 닫음(학생은 방 번호부터 다시)
function netResetRoom(room,close){
  if(!netRoomOk(room)) return Promise.resolve(false);
  const rid=Date.now().toString(36)+Math.random().toString(36).slice(2,6);
  return netClear(room).then(()=>{ try{ return fetch(netSetUrl(room),{method:"PATCH",body:JSON.stringify({resetId:rid,closed:close?true:null})}).then(r=>r.ok).catch(()=>false); }catch(e){ return false; } });
}
// TV: 방을 열 때 '닫힘' 표시를 지움 (같은 번호를 다시 쓸 수 있게)
function netOpenRoom(room){
  if(!netRoomOk(room)) return Promise.resolve(false);
  try{ return fetch(netSetUrl(room),{method:"PATCH",body:JSON.stringify({closed:null})}).then(r=>r.ok).catch(()=>false); }catch(e){ return Promise.resolve(false); }
}
setTimeout(netSettings,300); setInterval(netSettings,8000);
// 조별 관리: censor/방/ctl/조 = {sec: TV에서 준 추가 시간(초, 누적), admin: 관리 모드}. 5초마다 받아 옴
function netCtl(){
  if(typeof S==="undefined") return;
  if(!netRoomOk(S.room)||!S.group){ if(typeof teacherMode!=="undefined"&&teacherMode) setTeacherMode(false); return; }
  try{ fetch(netKindUrl(S.room,"ctl",S.group),{cache:"no-store"}).then(r=>r.ok?r.json():null).then(j=>{
    j=j||{}; if(typeof applyBonus==="function") applyBonus(Number.isInteger(j.sec)?j.sec:S.extra);
    if(typeof setTeacherMode==="function"&&!!j.admin!==teacherMode) setTeacherMode(!!j.admin);
  }).catch(()=>{}); }catch(e){}
}
function netSetCtl(room,g,patch){
  try{ return fetch(netKindUrl(room,"ctl",g),{method:"PATCH",body:JSON.stringify(patch)}).then(r=>r.ok).catch(()=>false); }catch(e){ return Promise.resolve(false); }
}
setTimeout(netCtl,500); setInterval(netCtl,5000);

</script>
<script>
CONFIG.defaultMinutes=CONFIG.minutes;
/* 게임 동작 코드. 대사는 story.js, 그림 경로는 assets.js에 있습니다. */
const TYPES=["직접","돌려","안으로"], TLABEL={직접:"직접 말하기",돌려:"상징을 통한 돌려 말하기",안으로:"내면 또는 민족적 정서 말하기"};
const KEY="censor-escape-v1";
let ROOT=document;
const $=s=>ROOT.querySelector(s);
const $$=s=>ROOT.querySelectorAll(s);
// story.js의 TEXT 문구에서 {분} {힌트초} {조} 같은 자리를 채움
const T=(s,o)=>String(s).replace(/\{([^{}]+)\}/g,(m,k)=>{const v=Object.assign({분:CONFIG.minutes,힌트초:CONFIG.hintPenaltySec,조:S.group},o)[k];return v==null?m:v;});
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
let S={group:null,start:null,penalty:0,extra:0,stage:0,hints:0,done:null,approved:false,sus:0,grilled:0,epi:false,poem:"",meaning:"",poemAt:0,caught:0,badSeen:false,wired:false,room:""};
try{const r=localStorage.getItem(KEY); if(r) S=Object.assign(S,JSON.parse(r));}catch(e){}
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){} if(typeof netPush==="function") netPush();};
let tick=null, ui={sel:{},per:{},cls:{},stamped:false,quiz:null,hintOn:null,s3ok:false};

function remain(){ if(!S.start) return CONFIG.minutes*60;
  const end=S.done||S.caught||Date.now(); return Math.round(CONFIG.minutes*60+S.extra-(end-S.start)/1000-S.penalty); }
const fmt=t=>{const a=Math.abs(t);return (t<0?"+":"")+String(Math.floor(a/60)).padStart(2,"0")+":"+String(a%60).padStart(2,"0")};
function bar(){
  const st=[1,2,3].map(n=>`<i class="${S.stage>n?"done":S.stage===n?"on":""}"></i>`).join("");
  return `<div class="bar"><span class="grp">${S.group}조</span><span class="steps" aria-label="진행">${st}</span>
  <span class="sus" title="의심도"><span>의심도</span><span class="g"><i></i></span></span><span class="time clk" role="timer">${fmt(remain())}</span></div>`;
}
function paintSus(){document.querySelectorAll(".sus").forEach(e=>{e.querySelector("i").style.width=Math.min(100,S.sus)+"%";
  e.classList.toggle("hi",S.sus>=50); e.classList.toggle("max",S.sus>=80);});}
function addSus(n){
  S.sus+=n;
  if(S.sus>=100){ S.grilled++; S.penalty+=60; S.sus=40; save(); paintSus(); paintClock();
    const o=document.createElement("div");o.className="overlay";o.setAttribute("role","dialog");
    o.innerHTML='<div class="card" style="border-color:var(--stamp)">'+stageHTML("interro","bossSus")+`<h2>${T(TEXT.grill.title)}</h2><p>${T(TEXT.grill.line)}</p><p class="note">${T(TEXT.grill.note)}</p><button class="btn" id="ox" type="button">${T(TEXT.grill.btn)}</button></div>`;
    document.body.appendChild(o); o.querySelector("#ox").onclick=()=>o.remove(); return; }
  save(); paintSus();
}
function paintClock(){const r=remain(); document.querySelectorAll(".clk").forEach(c=>{c.textContent=fmt(r); c.classList.toggle("over",r<0);});
  // 시간이 다 되면 배드엔딩. 모든 임무를 끝내고 문 앞(4단계)에 온 조는 잡히지 않음
  if(S.group&&S.start&&S.stage>=1&&S.stage<4&&!S.done&&!S.caught&&r<=0) timeUp();}
function timeUp(){
  S.caught=Date.now(); S.badSeen=false; if(typeof stopVerdict==="function") stopVerdict(); vnStop();
  document.querySelectorAll(".overlay").forEach(x=>x.remove()); save(); render(); window.scrollTo(0,0); }
function startTick(){paintSus();clearInterval(tick); tick=setInterval(paintClock,1000);}
function hint(text,key){
  S.hints++; S.penalty+=CONFIG.hintPenaltySec; save(); paintClock();
  return text;
}
function foot(){return `<div class="foot"><span>${T(TEXT.common.hintFoot)}</span><span><button id="rbtn" type="button">${T(TEXT.common.restart)}</button></span></div>`;}
const SPRH={guard:"84%",guardCalm:"84%",guardSus:"84%",boss:"88%",bossSus:"88%",contact:"86%",contactSide:"86%",contactHappy:"86%",courier:"86%",courierSide:"86%"};
const sprKey=(k,m)=>!k?k:(({guard:{calm:"guardCalm",sus:"guardSus"},boss:{sus:"bossSus"},contact:{side:"contactSide",happy:"contactHappy"},courier:{side:"courierSide"}}[k]||{})[m])||k;
function stageHTML(bg,spr){
  return `<div class="stage"><img class="bgimg" src="${IMG[bg]}" width="800" height="480" decoding="sync" alt="">${spr?`<span class="sw" style="--h:${SPRH[spr]}"><img class="spr0" src="${IMG[spr]}" alt="">${BLP[spr]?`<img class="pt" style="left:${BLP[spr].l}%;top:${BLP[spr].t}%;width:${BLP[spr].w}%;visibility:hidden" src="${BLP[spr].s}" alt="">`:''}</span>`:''}</div>`;
}
let vnTimer=null, vnStop=()=>{};
(function blinkLoop(){
  // 눈 깜빡임은 0.1초짜리 작은 변화라 '동작 줄이기' 설정과 상관없이 보여 줌 (학교 PC는 이 설정이 켜진 경우가 많음)
  const once=cb=>{const b=document.querySelector(".stage .pt,.overlay .pt"); if(!b){cb&&cb();return;} b.style.visibility="visible"; setTimeout(()=>{b.style.visibility="hidden"; cb&&cb();},120);};
  const go=()=>setTimeout(()=>{ once(()=>{ if(Math.random()<.2) setTimeout(()=>once(),160); }); go(); },2500+Math.random()*3000);
  go();
})();
function playVN(script,done){
  const a=$("#app"); let i=0, typing=false, full="", pos=0, bg="gate";
  a.innerHTML=`<div class="vn"><div class="vtop"><span>${S.group}조</span><button type="button" id="vskip">${T(TEXT.common.skip)}</button></div>
   <div class="pixwrap" id="vstage"></div>

function placeKey(M){
  const K=DRAWER.key, its=M.items.map(it=>DRAWER.items[it.id]).filter(Boolean), AR=800/480, spots=[];
  const hit=(d,cx,cy)=>cx>=d.x&&cx<=d.x+d.w&&cy>=d.y&&cy<=d.y+d.h;
  for(let x=4;x<=96-K.w;x+=3) for(let y=4;y<=96-K.h;y+=3){
    const cx=x+K.w/2, cy=y+K.h/2;
    if(its.filter(d=>hit(d,cx,cy)).length>=2) spots.push([x,y]);
  }
  const p=spots.length?spots[Math.floor(Math.random()*spots.length)]:[K.x||50,K.y||40];
  return {...K,x:p[0],y:p[1],r:0};
}

/* 꾹 누르고 있는 동안 리본이 당겨진다. 상관 패턴은 매번 다르게(랜덤) 움직인다. */
function bindM2(){
  const M=TEXT.m2, C=CONFIG.m2, el=panels.m2, st=$("#mstage"), spr=$("#mspr"), bub=$("#mbub"), msg=$("#msg"), btn=$("#mpull"), lab=$("#mlab");
  let n=0, mode="away", locked=false, timer=null, done=false, holding=false, lastT=0;
  const rnd=(a,b)=>a+Math.random()*(b-a);
  const paint=()=>{btn.style.setProperty("--p",Math.min(100,n/C.holdSec*100)+"%");};
  const set=m=>{ mode=m; st.className="stage mboss "+m+(IMG.bossBack?" hasback":"");
    spr.src=m==="look"?IMG.bossSus:(IMG.bossBack||IMG.boss);
    bub.textContent=T({away:M.bubAway,warn:M.bubWarn,look:M.bubLook}[m]||"");
    if(!locked||m==="away"){ msg.className="msg"+(m==="look"?" bad":""); msg.innerHTML=T(M[m]); }
    if(m==="away"){ locked=false; btn.classList.remove("lock"); } };
  // 상관 패턴: 서류 읽기 → (헛기침 → 돌아봄 | 헛기침만 하고 다시 서류) → ... 길이도 순서도 매번 랜덤
  const loop=()=>{
    if(done||!el.isConnected) return;
    if(el.hidden){ timer=setTimeout(loop,500); return; }   // 창을 닫아 두면 멈춤
    if(mode==="away"){
      set("warn"); timer=setTimeout(loop,rnd(400,1000));
    } else if(mode==="warn"){
      if(Math.random()<C.fakeChance){ set("away"); timer=setTimeout(loop,rnd(700,2200)); }   // 헛기침만 하고 안 돌아봄
      else { set("look"); timer=setTimeout(loop,rnd(900,2600)); }
    } else {
      set("away");
      timer=setTimeout(loop, Math.random()<C.quickChance?rnd(500,1000):rnd(1200,4500));      // 가끔 금방 또 헛기침
    }
  };
  const caught=()=>{ locked=true; holding=false; btn.classList.remove("on"); btn.classList.add("lock");
    n=Math.max(0,n-C.caughtBackSec); paint();
    msg.className="msg bad"; msg.innerHTML=T(M.caught,{의심도:C.caughtSus}); addSus(C.caughtSus); };
  const tick=()=>{
    const now=performance.now(), dt=Math.min(0.2,(now-lastT)/1000); lastT=now;
    if(done||!el.isConnected){ return; }
    if(holding&&!locked){
      if(mode==="look"){ caught(); }
      else { n+=dt; paint();
        if(n>=C.holdSec){ finish(); return; } }
    }
    requestAnimationFrame(tick);
  };
  const finish=()=>{ done=true; holding=false; clearTimeout(timer); set("away"); btn.classList.remove("on");
    btn.style.setProperty("--p","100%"); msg.className="msg ok"; msg.innerHTML=T(M.done);
    lab.innerHTML=T(M.take); btn.onclick=()=>{closePanel(); S.stage=3; save(); playVN(BOSSOUT,()=>{render(); toast(T(TEXT.s2.found),true); window.scrollTo(0,0);});}; };
  const down=e=>{ if(done||locked) return; e.preventDefault(); holding=true; btn.classList.add("on");
    try{btn.setPointerCapture(e.pointerId);}catch(_){} };
  const up=()=>{ holding=false; btn.classList.remove("on"); };
  btn.addEventListener("pointerdown",down);
  ["pointerup","pointercancel","lostpointercapture"].forEach(t=>btn.addEventListener(t,up));
  btn.addEventListener("contextmenu",e=>e.preventDefault());
  btn.addEventListener("keydown",e=>{ if((e.key===" "||e.key==="Enter")&&!e.repeat){ if(done){btn.click();return;} e.preventDefault(); down({preventDefault(){},pointerId:0}); }});
  btn.addEventListener("keyup",e=>{ if(e.key===" "||e.key==="Enter") up(); });
  paint(); set("away"); lastT=performance.now(); requestAnimationFrame(tick); timer=setTimeout(loop,rnd(1500,2800));
}
/* ---------- 미니게임 3: 타자기 리본 걸기 (어몽어스 전선 연결처럼 같은 색끼리 이어 주기) ---------- */
const WCOL=[["#e5484d","●","빨강"],["#3e8ef7","■","파랑"],["#f2c230","▲","노랑"],["#4fc27a","◆","초록"]];
function m3HTML(){

  <p class="story">${T(M.story)}</p>
  <div class="pixwrap wirewrap" id="wwrap"><canvas id="wcv" width="810" height="429"></canvas><svg id="wsvg" viewBox="0 0 810 429" role="group" aria-label="${esc(M.title)}"></svg></div>
  <div class="msg" id="msg" aria-live="polite">${T(M.start)}</div><div class="row" id="m3go"></div></div>`;
}
function bindM3(){
  const M=TEXT.m3, C=CONFIG.m3, A=IMG.m3, svg=$("#wsvg"), cv=$("#wcv"), wrap=$("#wwrap"), msg=$("#msg"), NS="http://www.w3.org/2000/svg";
  const shuf=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;};
  // 노드 중심: 왼쪽 버클 x=190, 오른쪽 걸이 x=627 (배경 그림의 못 자리)
  const W=810, H=429, L=[0,1,2,3], R=shuf(L), Y=[149,200,256,310], LX=190, RX=627, SX=200, EX=649;
  const mk=(n,a)=>{const e=document.createElementNS(NS,n);for(const k in a)e.setAttribute(k,a[k]);return e;};
  // 그림 불러오기 (다 받은 뒤에 그림)
  const load=src=>{const im=new Image(); im.src=src; return im;};
  const I={bg:load(A.bg), rib:A.ribbon.map(load)};
  const ok=im=>im&&im.complete&&im.naturalWidth>0;
  // 캔버스: 화면 배율(레티나)에 맞춰 선명하게
  const dpr=Math.min(3,Math.max(1,window.devicePixelRatio||1));
  cv.width=Math.round(W*dpr); cv.height=Math.round(H*dpr);
  const ctx=cv.getContext("2d"); ctx.imageSmoothingEnabled=true; try{ctx.imageSmoothingQuality="high";}catch(_){}
  // svg 층: 걸이(아래) → 버클 → 반짝임 → 터치 원
  const hooks=svg.appendChild(mk("g",{})), tips=svg.appendChild(mk("g",{})), fx=svg.appendChild(mk("g",{"pointer-events":"none"})), hits=svg.appendChild(mk("g",{}));
  const img=(g,href,x,y,w,h)=>g.appendChild(mk("image",{href,x,y,width:w,height:h,preserveAspectRatio:"none",style:"image-rendering:auto","pointer-events":"none"}));
  const node=(x,y,side,id)=>{
    const n={x,y,id,side,done:false};
    if(side==="L") n.im=img(tips,A.tip[id],154,y-27,114*.45,118*.45);
    else n.im=img(hooks,A.hook[id],614,y-28,152*.34,165*.34);
    n.hit=hits.appendChild(mk("circle",{cx:x,cy:y,r:36,fill:"transparent",style:side==="L"?"cursor:pointer":""}));
    return n;
  };
  const LN=L.map((id,i)=>node(LX,Y[i],"L",id)), RN=R.map((id,i)=>node(RX,Y[i],"R",id));
  // 리본: 3차 베지어 곡선을 따라 리본 그림을 잘게 쪼개 이어 그림
  const ribbon=(a,b,id,alpha)=>{
    const im=I.rib[id]; if(!ok(im)) return;
    const d=Math.hypot(b.x-a.x,b.y-a.y); if(d<2) return;
    const dx=Math.max(40,d*.35), p1={x:a.x+dx,y:a.y}, p2={x:b.x-dx,y:b.y};
    const N=120, P=[];
    for(let i=0;i<=N;i++){const t=i/N,u=1-t;
      P.push({x:u*u*u*a.x+3*u*u*t*p1.x+3*u*t*t*p2.x+t*t*t*b.x, y:u*u*u*a.y+3*u*u*t*p1.y+3*u*t*t*p2.y+t*t*t*b.y});}
    const seg=[]; let tot=0; for(let i=0;i<N;i++){const l=Math.hypot(P[i+1].x-P[i].x,P[i+1].y-P[i].y); seg.push(l); tot+=l;}
    if(tot<1) return;
    const k=Math.min(1,Math.max(0,(d-150)/350)), w=24*(1-.15*k);   // 팽팽할수록 최대 15% 얇게
    const iw=im.naturalWidth, ih=im.naturalHeight; let s=0;
    ctx.save(); ctx.globalAlpha=alpha==null?1:alpha;
    for(let i=0;i<N;i++){ const l=seg[i]; if(l<=0) continue;
      const sx=s/tot*iw, sw=Math.max(.5,l/tot*iw);
      ctx.save(); ctx.translate(P[i].x,P[i].y); ctx.rotate(Math.atan2(P[i+1].y-P[i].y,P[i+1].x-P[i].x));
      ctx.drawImage(im,Math.min(sx,iw-sw),0,sw,ih,0,-w/2,l+.8,w);   // +.8: 조각 사이 틈이 보이지 않게 살짝 겹침
      ctx.restore(); s+=l; }
    ctx.restore();
  };
  const linked=[];   // 걸린 리본 [{a,b,id}]
  let drag=null, cur=null, solved=0, raf=0, back=null;
  const draw=()=>{
    ctx.setTransform(dpr,0,0,dpr,0,0); ctx.clearRect(0,0,W,H);
    if(ok(I.bg)) ctx.drawImage(I.bg,0,0,W,H);
    linked.forEach(r=>ribbon(r.a,r.b,r.id));
    if(drag&&cur) ribbon({x:SX,y:drag.y},cur,drag.id);
    if(back) ribbon({x:SX,y:back.y},back.p,back.id);
  };
  const loop=()=>{ raf=0; const now=performance.now();
    if(back){ const t=Math.min(1,(now-back.t0)/200);   // 틀렸을 때: 0.2초 동안 시작점으로 줄어듦
      back.p={x:back.from.x+(SX-back.from.x)*t, y:back.from.y+(back.y-back.from.y)*t}; if(t>=1) back=null; }
    draw();
    if(drag||back) raf=requestAnimationFrame(loop);
  };
  const kick=()=>{ if(!raf) raf=requestAnimationFrame(loop); };
  const all=[I.bg,...I.rib]; let left=all.length;
  all.forEach(im=>{ if(im.complete){ if(--left===0) draw(); } else im.onload=im.onerror=()=>{ if(--left===0) draw(); }; });
  if(left>0&&ok(I.bg)) draw();
  const pt=e=>{const m=svg.getScreenCTM().inverse(),p=svg.createSVGPoint();p.x=e.clientX;p.y=e.clientY;const q=p.matrixTransform(m);return {x:q.x,y:q.y};};
  const near=(p,list)=>list.filter(n=>!n.done).map(n=>[Math.hypot(n.x-p.x,n.y-p.y),n]).filter(d=>d[0]<C.snap).sort((a,b)=>a[0]-b[0])[0];
  const spark=(x,y)=>{ let f=0; const s=img(fx,A.spark[0],x-42,y-42,84,84);
    const step=()=>{ f++; if(f>=A.spark.length){ s.remove(); return; } s.setAttribute("href",A.spark[f]); setTimeout(step,80); };
    setTimeout(step,80); };
  const shake=()=>{ wrap.classList.remove("shake"); void wrap.offsetWidth; wrap.classList.add("shake"); };
  svg.style.touchAction="none";
  svg.addEventListener("pointerdown",e=>{ if(solved>=4) return;
    const h=near(pt(e),LN); if(!h) return;   // 왼쪽 버클에서만 끌기 시작
    e.preventDefault(); drag=h[1]; cur=pt(e); back=null; try{svg.setPointerCapture(e.pointerId);}catch(_){} kick(); });
  svg.addEventListener("pointermove",e=>{ if(!drag) return; cur=pt(e); kick(); });
  const end=e=>{ if(!drag) return;
    const p=pt(e), h=near(p,RN), a=drag; drag=null;
    if(h&&h[1].id===a.id){ const b=h[1]; a.done=b.done=true; solved++; cur=null;
      linked.push({a:{x:SX,y:a.y},b:{x:EX,y:b.y},id:a.id});
      { const im=b.im, hd=new Image(); hd.onload=()=>{ im.setAttribute("width",hd.naturalWidth*.34); im.setAttribute("height",hd.naturalHeight*.34); im.setAttribute("href",hd.src); }; hd.src=A.hookDone[b.id]; }   // 그림 크기는 파일에서 읽어 같은 배율(0.34)로
      a.hit.style.cursor="default"; spark(640,b.y); kick();
      if(solved<4){ msg.className="msg ok"; msg.innerHTML=T(M.good,{남은:4-solved}); }
      else{ msg.className="msg ok"; msg.innerHTML=T(M.done);
        svg.style.pointerEvents="none";
        const go=document.createElement("button"); go.className="btn"; go.type="button"; go.textContent=T(M.sit);
        go.onclick=()=>{ S.wired=true; save(); closePanel(); openPanel("s3",stage3HTML(),bindStage3); }; $("#m3go").appendChild(go); }
      return; }
    // 빈 곳이나 다른 색: 리본이 시작점으로 되감김
    back={id:a.id,y:a.y,from:cur||p,p:cur||p,t0:performance.now()}; cur=null; kick();
    if(h){ msg.className="msg bad"; msg.innerHTML=T(M.wrong,{의심도:C.wrongSus}); if(C.wrongSus) addSus(C.wrongSus); shake(); }
  };
  svg.addEventListener("pointerup",end);
  svg.addEventListener("pointercancel",()=>{ if(!drag) return; back={id:drag.id,y:drag.y,from:cur||{x:SX,y:drag.y},p:cur||{x:SX,y:drag.y},t0:performance.now()}; drag=null; cur=null; kick(); });
}

// TV에서 선생님이 누른 판정을 3초마다 확인
let verdictTimer=null;
function stopVerdict(){ clearInterval(verdictTimer); verdictTimer=null; }
function watchVerdict(){
  stopVerdict(); const room=S.room, gp=S.group, at=S.poemAt;
  const chk=()=>{
    if(S.done||S.stage!==4||S.poemAt!==at||S.room!==room||S.group!==gp) return stopVerdict();
    netVerdict(room,gp).then(v=>{
      if(!v||v.for!==at||!verdictTimer||S.done||S.stage!==4||S.poemAt!==at) return;
      stopVerdict();
      const k=v.kind||(v.ok?"pass":"vague");
      if(k==="pass"){ S.approved=true; finish(); } else rejected(k);
    });
  };
  verdictTimer=setInterval(chk,3000); chk();

// 선생님이 TV에서 '검열'이나 '보류'(예전 '의미 모호')를 누르면 장면을 보여 주고, 3단계로 돌아가 원래 시를 고쳐 씀

//  vague : 접선책이 뜻이 흐리다며 돌려보냄
function rejected(kind){
  const poem=S.poem, mean=S.meaning, D=TEXT.door, cz=kind==="censor";
  S.stage=3; S.wired=true; S.poem=""; S.meaning=""; S.poemAt=0; save(); render(); window.scrollTo(0,0);
  const back=msg=>{ openKey("s3");
    const t1=$("#t1"), t2=$("#t2"), m=$("#msg");
    if(t1){ t1.value=poem||""; t2.value=mean||""; t1.oninput&&t1.oninput(); }
    if(m){ m.className="msg bad"; m.innerHTML=T(msg); } };
  const o=document.createElement("div"); o.className="overlay"; o.setAttribute("role","dialog");
  o.innerHTML='<div class="card" style="border-color:var(--stamp)">'+(cz?stageHTML("room","bossSus"):stageHTML("street","courierSide"))+`<h2>${T(cz?D.censorTitle:D.rejectTitle)}</h2>
  <p><b>${T(cz?D.censorWho:D.rejectWho)}</b><br>${T(cz?D.censorLine:D.rejectLine)}</p>
  <div class="paper"><span class="no">${T(cz?D.censorPoemLabel:D.rejectPoemLabel)}</span><div class="txt" style="white-space:pre-wrap">${esc(poem)}</div></div>
  ${cz?`<p class="msg bad"><b>${T(D.censorSus)}</b></p>`:`<p class="note">${T(D.rejectNote)}</p>`}
  <button class="btn" id="rjx" type="button">${T(cz?D.censorBtn:D.rejectBtn)}</button></div>`;
  document.body.appendChild(o);
  o.querySelector("#rjx").onclick=()=>{ o.remove();
    if(!cz) return back(D.rejected);
    addSus(Math.max(0,100-S.sus));   // 의심도 가득 → 취조실 장면(심문)이 뜸
    const ox=[...document.querySelectorAll(".overlay #ox")].pop();
    if(ox) ox.onclick=()=>{ ox.closest(".overlay").remove(); back(D.censorAfter); }; else back(D.censorAfter); };
}
function finish(){S.done=Date.now();save();render();window.scrollTo(0,0);}
/* ---------- 마무리 ---------- */
function finaleHTML(){
  const ch=netPiece(S.group), el=Math.round((S.done-S.start)/1000)+S.penalty-S.extra, over=remain()<0;
  return `<div style="display:flex;flex-direction:column;gap:18px;padding-top:24px"><h3>${S.group}조</h3><h1>${T(TEXT.finale.title)}</h1>
  <p class="story">${T(S.sus<30?TEXT.finale.good:S.sus<70?TEXT.finale.mid:TEXT.finale.bad)} ${T(TEXT.finale.after)}</p>
  <div class="big" aria-label="글자 조각">${esc(ch)}</div>
  <p style="text-align:center" class="note">${T(TEXT.finale.piece)}</p>
  <div class="stats"><span>걸린 시간 <b>${fmt(Math.max(0,el))}</b></span><span>사용한 힌트 <b>${S.hints}</b></span><span>심문 <b>${S.grilled}</b>회</span><span>의심도 <b>${Math.min(100,S.sus)}%</b></span>${over?`<span>제한 시간을 넘겼습니다</span>`:""}</div>
  <div class="card"><h3>${T(TEXT.finale.wrapTitle)}</h3>
  ${TEXT.finale.wrap.map(p=>`<p>${T(p)}</p>`).join("")}
  <p class="note">${T(TEXT.finale.next)}</p></div>
  <div class="foot"><span></span><span><button id="rbtn" type="button">${T(TEXT.common.restart)}</button></span></div></div>`;
}
function badHTML(){
  const B=TEXT.badend, el=Math.round((S.caught-S.start)/1000)+S.penalty-S.extra;
  return `<div style="display:flex;flex-direction:column;gap:18px;padding-top:24px"><h3>${S.group}조</h3><h1 style="color:var(--stamp)">${T(B.title)}</h1>
  <p class="story">${T(B.story)}</p>
  <div class="big" aria-label="글자 조각 없음" style="color:#6a6454;border-color:#6a6454">✕</div>
  <p style="text-align:center" class="note">${T(B.noPiece)}</p>
  <div class="stats"><span>버틴 시간 <b>${fmt(Math.max(0,el))}</b></span><span>사용한 힌트 <b>${S.hints}</b></span><span>심문 <b>${S.grilled}</b>회</span><span>의심도 <b>${Math.min(100,S.sus)}%</b></span></div>
  <div class="card"><h3>${T(TEXT.finale.wrapTitle)}</h3>
  ${TEXT.finale.wrap.map(p=>`<p>${T(p)}</p>`).join("")}
  <p class="note">${T(TEXT.finale.next)}</p></div>
  <div class="foot"><span></span><span><button id="rbtn" type="button">${T(TEXT.common.restart)}</button></span></div></div>`;
}
/* ---------- 관리 모드 ---------- */
function resetAll(){ const rm=S.room, gp=S.group; if(typeof netClear==="function"&&gp) netClear(rm,gp); S={group:null,start:null,penalty:0,extra:0,stage:0,hints:0,done:null,approved:false,sus:0,grilled:0,epi:false,poem:"",meaning:"",poemAt:0,caught:0,badSeen:false,wired:false,room:rm};save();render();window.scrollTo(0,0);}
function bindFoot(){
  const r=$("#rbtn"); if(r){ let t=null; r.onclick=()=>{ if(t){clearTimeout(t);resetAll();return;}
    r.textContent=T(TEXT.common.restartAgain); t=setTimeout(()=>{t=null;r.textContent=T(TEXT.common.restart);},4000); }; } }
/* 관리 모드: 교실 TV에서 조마다 켜고 끕니다(net.js의 netCtl이 받아 옴). 학생 화면에는 켜는 버튼이 없습니다.
   켜지면 화면 구석에 ‘메뉴’와 ‘넘기기 ▶’가 생겨 단계를 바로 넘길 수 있습니다. 기기에 기억하지 않습니다. */
let teacherMode=false; try{localStorage.removeItem("censor-escape-teacher");}catch(e){}   // 예전 버전이 기억해 둔 교사 모드 지우기
function setTeacherMode(on){ teacherMode=!!on; if(!on) document.querySelectorAll(".overlay.tmenu").forEach(x=>x.remove()); paintTeacher(); }
// 바로 가기 목록: [이름, 상태를 맞추고 화면을 여는 함수]
const JUMPS=[
  ["프롤로그",()=>{S.stage=0;}],
  ["1단계",()=>{S.stage=1;},"s1"],["서랍 게임",()=>{S.stage=1;},"m1"],
  ["2단계",()=>{S.stage=2;},"s2"],["서류함 게임",()=>{S.stage=2;},"m2"],
  ["상관 자리 비움",()=>{S.stage=3;},"boss"],["리본 걸기 게임",()=>{S.stage=3;S.wired=false;},"m3"],
  ["3단계",()=>{S.stage=3;S.wired=true;},"s3"],["문",()=>{S.stage=4;},"door"],
  ["에필로그",()=>{S.stage=4;S.done=Date.now();S.epi=false;}],
  ["결과 화면",()=>{S.stage=4;S.done=S.done||Date.now();S.epi=true;}],
  ["배드엔딩",()=>{S.stage=Math.max(1,Math.min(3,S.stage));S.caught=Date.now();S.badSeen=false;}]
];
const PANELS={s1:()=>[stage1HTML(),bindStage1],m1:()=>[m1HTML(),bindM1],s2:()=>[stage2HTML(),bindStage2],m2:()=>[m2HTML(),bindM2],m3:()=>[m3HTML(),bindM3],s3:()=>[stage3HTML(),bindStage3],door:()=>[doorHTML(),bindDoor]};
function openKey(k){ if(k==="boss"){ S.stage=3; save(); return playVN(BOSSOUT,()=>{render();window.scrollTo(0,0);}); } const [h,b]=PANELS[k](); openPanel(k,h,b); }
function jumpTo(i){
  vnStop(); document.querySelectorAll(".overlay").forEach(x=>x.remove());
  S.group=S.group||1; S.done=null; S.epi=false; S.start=S.start||Date.now();
  S.approved=false;   // 문 화면에서 비밀번호 칸이 다시 보이게
  S.caught=0; S.badSeen=false;
  stopVerdict();
  JUMPS[i][1](); save(); render(); window.scrollTo(0,0);
  if(JUMPS[i][2]) openKey(JUMPS[i][2]);
}
// 지금 화면 바로 다음으로
function teacherNext(){
  if(!S.group) return jumpTo(0);
  if(S.caught) return;
  if(S.done) return jumpTo(JUMPS.findIndex(j=>j[0]==="결과 화면"));
  if(S.stage===0) return jumpTo(1);
  const order=["s1","m1","s2","m2","boss","m3","s3","door"], room={1:"s1",2:"s2",3:S.wired?"s3":"m3",4:"door"};
  if(!curKey) return openKey(room[S.stage]);
  if(curKey==="door"){ S.approved=true; stopVerdict(); closePanel(); return finish(); }
  jumpTo(JUMPS.findIndex(j=>j[2]===order[order.indexOf(curKey)+1]));
}
function paintTeacher(){
  let t=document.querySelector("#tbar");
  const show=teacherMode&&!(S.done&&S.epi)&&!S.caught;
  if(!teacherMode){ if(t) t.remove(); return; }
  if(!t){ t=document.createElement("div"); t.id="tbar";
    t.innerHTML=`<span>관리 모드</span><button type="button" id="tmenu">메뉴</button><button type="button" id="tnext">넘기기 ▶</button>`;
    document.body.appendChild(t); t.querySelector("#tmenu").onclick=teacher; t.querySelector("#tnext").onclick=teacherNext; }
  t.querySelector("#tnext").hidden=!show;
}
function teacher(){
  if(!teacherMode) return;
  const o=document.createElement("div");o.className="overlay tmenu";o.setAttribute("role","dialog");o.setAttribute("aria-label","관리 모드");
  o.innerHTML=`<div class="card"><h2>관리 모드</h2>
    <p class="note">교실 TV에서 켠 관리 모드입니다. 화면 오른쪽 아래 ‘넘기기 ▶’로 문제를 풀지 않고 다음으로 넘어갈 수 있습니다. 끄는 것도 TV에서 합니다. 시간 추가(+5분)도 TV의 이 조 칸에서 합니다.</p>
    <h3>바로 가기</h3><div class="row tjump">${JUMPS.map((j,i)=>`<button class="btn ghost" type="button" data-j="${i}">${j[0]}</button>`).join("")}</div>
    <div class="row"><button class="btn ghost" id="rs" type="button">이 기기 처음부터</button></div>
    <h3>정답</h3><ul class="key"><li>1단계: ${CONFIG.cards.map((c,i)=>`${i+1}번 ${c.answer}`).join(", ")}</li>
    <li>2단계: ${CONFIG.docs.map((d,i)=>`${i+1}번 ${TLABEL[d.type]}`).join(", ")} / 삭제 도장 글의 특징은 ‘${esc(CONFIG.s2quiz.opts[CONFIG.s2quiz.ans])}’</li>
    <li>3단계: 삭제 대상 낱말(${CONFIG.s3.banned.join(", ")})을 쓰지 않고, 상징어를 넣은 두 줄 이상의 시와 숨은 뜻을 확인</li></ul>
    <div class="row"><button class="btn ghost" id="tc" type="button">닫기</button></div></div>`;
  document.body.appendChild(o);
  const q=s=>o.querySelector(s);
  q("#tc").onclick=()=>o.remove();
  o.querySelectorAll("[data-j]").forEach(b=>b.onclick=()=>{o.remove();jumpTo(+b.dataset.j);});
  q("#rs").onclick=()=>{o.remove();resetAll();};
}
// TV에서 '기록 초기화'나 '새 검열실 개설'을 누르면: 진행을 모두 지우고 처음 화면으로
function roomReset(closed){
  vnStop(); if(typeof stopVerdict==="function") stopVerdict(); disposePanels();
  document.querySelectorAll(".overlay").forEach(x=>x.remove());
  const rm=closed?"":S.room, rid=S.resetId;
  if(closed){ try{ history.replaceState(null,"",location.pathname); }catch(e){} }   // 주소의 ?room= 도 지움
  S={group:null,start:null,penalty:0,extra:0,stage:0,hints:0,done:null,approved:false,sus:0,grilled:0,epi:false,poem:"",meaning:"",poemAt:0,caught:0,badSeen:false,wired:false,room:rm,resetId:closed?null:rid};
  CONFIG.minutes=CONFIG.defaultMinutes||CONFIG.minutes; setTeacherMode(false); save(); render(); window.scrollTo(0,0);
  const o=document.createElement("div"); o.className="overlay"; o.setAttribute("role","dialog");
  o.innerHTML=`<div class="card"><h2>${T(closed?TEXT.reset.closedTitle:TEXT.reset.title)}</h2><p>${T(closed?TEXT.reset.closed:TEXT.reset.line)}</p><button class="btn" type="button">${T(TEXT.reset.btn)}</button></div>`;
  document.body.appendChild(o); o.querySelector("button").onclick=()=>o.remove();
}
// TV에서 준 추가 시간(초, 누적)을 반영. 붙잡힌 조는 붙잡힌 순간부터 다시 이어서 함
function applyBonus(sec){
  if(!Number.isInteger(sec)||sec<0||sec===S.extra||!S.group) return;
  const add=sec-S.extra; S.extra=sec;
  if(S.caught&&!S.done&&add>0){ S.start+=Date.now()-S.caught; S.caught=0; S.badSeen=false; vnStop();
    document.querySelectorAll(".overlay").forEach(x=>x.remove()); save(); render(); window.scrollTo(0,0); toast("시간이 "+Math.round(add/60)+"분 늘었다. 다시 임무로!",true); return; }
  save(); paintClock(); if(add>0) toast("시간이 "+Math.round(add/60)+"분 늘었다!",true);
}
render();
// 첫 화면을 띄운 뒤, 나머지 그림을 뒤에서 미리 받아 둠 (장면이 바뀔 때 끊기지 않게)
(function preload(){
  const urls=new Set(), walk=v=>{ if(typeof v==="string"){ if(/\.(png|webp)$/.test(v)) urls.add(v); } else if(v&&typeof v==="object") Object.values(v).forEach(walk); };
  [IMG,BLP,CUT,typeof DRAWER!=="undefined"?DRAWER:null].forEach(walk);
  const list=[...urls]; let i=0;
  const next=()=>{ if(i>=list.length) return; const im=new Image(); im.onload=im.onerror=next; im.src=list[i++]; };
  // 글꼴을 다 받은 뒤에 그림을 4장씩 차례로 (글꼴이 먼저)
  const go=()=>{ for(let k=0;k<4;k++) next(); };
  (document.fonts&&document.fonts.ready?document.fonts.ready:Promise.resolve()).then(()=>setTimeout(go,200),()=>setTimeout(go,200));
})();

</script>
</body>
