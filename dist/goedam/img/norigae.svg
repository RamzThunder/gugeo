<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 420">
  <!-- 거울 노리개(일자로 늘어뜨림). 거울 면: 가운데 (100,190), 반지름 46 → goedam.css의 .mirror 위치와 맞춰 둠 -->
  <defs>
    <linearGradient id="cord" x1="0" x2="1"><stop offset="0" stop-color="#8e1a14"/><stop offset=".5" stop-color="#d8392a"/><stop offset="1" stop-color="#8e1a14"/></linearGradient>
    <radialGradient id="knot" cx=".4" cy=".35" r=".7"><stop offset="0" stop-color="#f05a40"/><stop offset=".6" stop-color="#c22a1d"/><stop offset="1" stop-color="#7c140f"/></radialGradient>
    <radialGradient id="bead" cx=".35" cy=".3" r=".75"><stop offset="0" stop-color="#8fc0ff"/><stop offset=".45" stop-color="#2f6fd6"/><stop offset="1" stop-color="#123a86"/></radialGradient>
    <radialGradient id="jade" cx=".4" cy=".3" r=".8"><stop offset="0" stop-color="#6fa58a"/><stop offset=".5" stop-color="#2f5f4b"/><stop offset="1" stop-color="#16302a"/></radialGradient>
