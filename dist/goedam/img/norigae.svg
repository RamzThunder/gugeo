  <path d="M92 292c-6 30-12 70-20 118h56c-8-48-14-88-20-118z" fill="url(#tassel)" stroke="#0f2f6e" stroke-width="1.2"/>
  <g stroke="#6f9cf0" stroke-width="1.1" opacity=".55" fill="none">
