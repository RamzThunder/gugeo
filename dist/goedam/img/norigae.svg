    <circle cx="86" cy="90" r="10"/><circle cx="114" cy="90" r="10"/><rect x="88" y="62" width="24" height="24" rx="5"/>
  </g>
  <path d="M90 66h20M90 74h20M90 82h20M94 62v24M100 62v24M106 62v24" stroke="#ffb3a1" stroke-width="1.2" opacity=".55"/>
