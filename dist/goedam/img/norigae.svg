    <circle cx="100" cy="131" r="10"/><circle cx="129.5" cy="138.9" r="10"/><circle cx="151.1" cy="160.5" r="10"/><circle cx="159" cy="190" r="10"/>
    <circle cx="151.1" cy="219.5" r="10"/><circle cx="129.5" cy="241.1" r="10"/><circle cx="100" cy="249" r="10"/><circle cx="70.5" cy="241.1" r="10"/>
    <circle cx="48.9" cy="219.5" r="10"/><circle cx="41" cy="190" r="10"/><circle cx="48.9" cy="160.5" r="10"/><circle cx="70.5" cy="138.9" r="10"/>
  </g>
  <circle cx="100" cy="190" r="58" fill="url(#jade)" stroke="#0e1f19" stroke-width="2"/>
  <circle cx="100" cy="190" r="51" fill="none" stroke="url(#gold)" stroke-width="5"/>
  <circle cx="100" cy="190" r="46" fill="#9fb4b6"/>
  <g fill="#e9f7ee" opacity=".8"><circle cx="72" cy="150" r="1.6"/><circle cx="136" cy="160" r="1.4"/><circle cx="140" cy="225" r="1.6"/><circle cx="62" cy="228" r="1.4"/></g>
