    <linearGradient id="tassel" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="#2a63c9"/><stop offset=".7" stop-color="#1f4fa8"/><stop offset="1" stop-color="#183f89"/></linearGradient>
  </defs>
  <!-- 손에 쥐는 고리 -->
